<!doctype html>
<html lang="vi" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tin Học RPG</title>
<meta name="theme-color" content="#05070d">
<meta name="app-version" content="final-dark-v3">
<meta name="description" content="Tin Học RPG — nền tảng học C++ và luyện HSGQG Tin học theo RPG">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./Tin%20Hoc%20RPG.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./rpg-icon-192.png">
<link rel="apple-touch-icon" href="./rpg-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f8;--c:#fff;--t:#1b2040;--m:#6a7090;--a:#3b4cca;--g:#e0a526;--b:#dde1f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121734;--c:#1b2250;--t:#eef0ff;--m:#9ba3d4;--a:#7f8dff;--b:#2c3570}}
:root[data-theme="dark"]{--bg:#121734;--c:#1b2250;--t:#eef0ff;--m:#9ba3d4;--a:#7f8dff;--b:#2c3570}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
.w{max-width:760px;margin:auto;padding:12px}
.hd{display:flex;gap:12px;align-items:center;background:var(--c);border:2px solid var(--a);border-radius:18px;padding:12px}
.bdg{font-size:38px}.g1{flex:1;min-width:0}
.bar{height:12px;background:var(--b);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
small{color:var(--m)}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:0 0 auto;min-width:76px;padding:8px 8px;font-size:13px;white-space:nowrap}nav{overflow-x:auto;scrollbar-width:thin}
button,.btn{font:inherit;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none}
.on,.pri{background:var(--a);color:#fff;border-color:var(--a)}
.nd{display:flex;gap:10px;align-items:center;background:var(--c);border:1px solid var(--b);border-left:6px solid var(--k);border-radius:12px;padding:10px;margin:8px 0}
.nd.cur{box-shadow:0 0 0 2px var(--k)}.nd span{font-size:26px}
.pr{cursor:pointer}.problemCard{user-select:none;touch-action:manipulation;transition:transform .16s ease,box-shadow .16s ease}.problemCard:focus-visible{outline:3px solid color-mix(in srgb,var(--a) 45%,transparent);outline-offset:2px}.problemCard:hover{transform:translateY(-2px)}.problemCard:active{transform:scale(.995)}.lk{opacity:.5;cursor:default}
.note{background:var(--c);border:1px dashed var(--a);border-radius:12px;padding:10px;margin:8px 0}
.ok{border-style:solid;border-color:var(--g);font-weight:600}
details{background:var(--c);border:1px solid var(--b);border-radius:12px;margin:8px 0;padding:10px}
summary{cursor:pointer}.bd{margin-top:8px}
.chip{display:inline-block;background:var(--b);border-radius:8px;padding:2px 8px;margin:2px;font-size:12px}
code{background:var(--b);padding:1px 5px;border-radius:5px}
pre,textarea{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:10px;overflow-x:auto;margin:4px 0}
textarea{width:100%;height:280px;resize:vertical;white-space:pre;tab-size:2}
.io{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
h3,h4{margin:10px 0 4px}
input,select{font:inherit;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:8px;max-width:100%}
@keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes pop{0%{transform:scale(.96);opacity:.4}65%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--a) 18%,transparent)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes fillPulse{0%{filter:brightness(1)}50%{filter:brightness(1.35)}100%{filter:brightness(1)}}
@keyframes floatUp{0%{transform:translateY(8px) scale(.9);opacity:0}15%{opacity:1}100%{transform:translateY(-46px) scale(1.05);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.floatxp{position:fixed;right:24px;top:96px;z-index:50;font-weight:800;color:var(--g);text-shadow:0 2px 8px rgba(0,0,0,.2);animation:floatUp 1.15s ease forwards;pointer-events:none}
.runner{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.runner textarea{height:150px}
.outbox{min-height:150px;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;overflow:auto}
.outbox pre{border:0;padding:0;margin:0;white-space:pre-wrap;min-height:128px}
.req{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
.req div{padding:8px;border-radius:10px;background:var(--b);text-align:center;font-size:12px}
.req b{display:block;font-size:16px}
.mini{margin:7px 0;padding:8px}.topic-chips{margin:4px 0 10px}.lesson{overflow:hidden}.lesson summary{font-size:14px;font-weight:700}.lesson-body p{margin:6px 0}.lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lesson-grid section{background:color-mix(in srgb,var(--b) 28%,var(--c));border-radius:10px;padding:10px}.lesson h4{margin-top:3px}.lesson pre{white-space:pre-wrap;max-height:360px;overflow:auto}.lesson-check{margin-top:10px;background:color-mix(in srgb,var(--a) 8%,var(--c));border-left:4px solid var(--a);padding:9px 10px;border-radius:8px}.deep{background:color-mix(in srgb,var(--g) 5%,var(--c))}@media(max-width:620px){.lesson-grid{grid-template-columns:1fr}}

@media(max-width:620px){.runner{grid-template-columns:1fr}.req{grid-template-columns:1fr}}

.nd,details,.hd,.note,.judge{animation:rise .28s ease both}
.hd{animation:pop .35s ease both}
.bar i{animation:fillPulse .7s ease}
.judge.ac{animation:pop .38s ease both;border-color:var(--g)}
.judge.wa,.judge.ce,.judge.re{animation:shake .35s ease both}
.judge{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin:8px 0}
.judge.ac{border-color:var(--g);background:color-mix(in srgb,var(--g) 8%,var(--c))}
.judge.wa,.judge.ce,.judge.re{border-color:#d63031;background:color-mix(in srgb,#d63031 7%,var(--c))}
.judge.wait{border-color:var(--a);animation:glow 1.1s ease infinite}
.judge .status{font-weight:800;letter-spacing:.2px}
.judge pre{max-height:180px;overflow:auto}
.submitbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pri.submit{box-shadow:0 6px 16px color-mix(in srgb,var(--a) 24%,transparent);transition:transform .18s,box-shadow .18s}
.pri.submit:hover{transform:translateY(-1px);box-shadow:0 8px 20px color-mix(in srgb,var(--a) 32%,transparent)}
@media(max-width:620px){.io{grid-template-columns:1fr}.submitbar button{flex:1}}

/* ===== Online account + leaderboard ===== */
.accountBox{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 76%,var(--a)));border:1px solid var(--b);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 8px 24px rgba(30,40,90,.08)}
.accountRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:#fff;font-weight:800;font-size:18px;box-shadow:0 8px 18px rgba(59,76,202,.25)}
.accountMeta{flex:1;min-width:180px}.accountMeta b{display:block}.rankBadge{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;background:var(--c);margin-top:4px}
.authPanel{display:grid;gap:8px}.authPanel input{width:100%}.authTabs{display:flex;gap:6px}.authTabs button{flex:1}.authTabs .on{background:var(--a);color:#fff}
.lb{display:grid;gap:8px}.lbItem{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--c);border:1px solid var(--b);border-radius:13px;padding:10px;transition:transform .18s,box-shadow .18s}.lbItem:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,40,90,.1)}.lbItem.me{border:2px solid var(--a);animation:rankPulse 1.8s ease-in-out infinite}.lbPos{font-size:22px;font-weight:800;text-align:center}.lbName{min-width:0}.lbName b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbXp{text-align:right;font-weight:800}.rankHero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--c);border:2px solid var(--a);border-radius:16px;padding:14px;margin:8px 0}.rankNum{font-size:34px;font-weight:800}.cloudStatus{font-size:12px;color:var(--m)}
.setupBox{background:#fff8e1;border:1px solid #e0a526;border-radius:12px;padding:10px;color:#6b5310}.setupBox code{word-break:break-all}.syncDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:5px;vertical-align:middle}
.authMsg{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--b);font-size:13px}.authMsg.ok{background:#eafaf2;border-color:#7ad6a8;color:#12633f}.authMsg.warn{background:#fff7df;border-color:#e0b34d;color:#6f5310}

.adminWrap{display:grid;gap:12px;margin:10px 0}.adminGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.adminStat{border:1px solid var(--b);background:var(--c);border-radius:13px;padding:11px}.adminStat b{display:block;font-size:22px}.adminTabs{display:flex;gap:6px;flex-wrap:wrap}.adminTabs button.active{background:var(--a);color:#fff}.adminTable{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}.adminTable th,.adminTable td{padding:8px;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle}.adminTable input{max-width:100px;min-width:72px}.adminScroll{overflow:auto;border:1px solid var(--b);border-radius:12px}.adminForm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.adminForm textarea{grid-column:1/-1;min-height:150px;width:100%;font:12px/1.5 ui-monospace,monospace}.adminForm input,.adminForm select,.adminForm textarea{min-width:0}.adminMuted{color:var(--m);font-size:12px}.adminLock{color:#ff718f;font-weight:800}.adminOn{color:#38d6a0;font-weight:800}@media(max-width:620px){.adminGrid{grid-template-columns:1fr 1fr}.adminForm{grid-template-columns:1fr}}
@keyframes rankPulse{0%,100%{box-shadow:0 0 0 0 rgba(59,76,202,0)}50%{box-shadow:0 0 0 6px rgba(59,76,202,.08)}}

/* ===== PHASE 2: Knowledge / Mastery / HSG / Mistakes ===== */
.phase2Hero{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 11%,var(--c)),var(--c));border:1px solid var(--b);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 10px 28px rgba(30,40,90,.07);animation:rise .3s ease both}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.statcard{background:var(--c);border:1px solid var(--b);border-radius:13px;padding:10px;text-align:center}.statcard b{display:block;font-size:20px}.statcard small{display:block;margin-top:2px}
.ktoolbar{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin:10px 0}.ktoolbar input{width:100%}.ktoolbar select{min-width:120px}
.topicHeader{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.topicMain{flex:1;min-width:0}.masteryBar{height:7px;background:var(--b);border-radius:99px;overflow:hidden;margin-top:6px}.masteryBar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .45s ease}
.masteryTag{font-size:11px;padding:3px 7px;border-radius:999px;border:1px solid var(--b);background:var(--c);white-space:nowrap}.masteryTag.done{border-color:var(--g);background:color-mix(in srgb,var(--g) 10%,var(--c))}
.topicActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.topicActions button{font-size:12px;padding:6px 9px}
.quizBox{margin-top:9px;border:1px solid var(--b);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--a) 4%,var(--c))}.quizQ{padding:9px 0;border-bottom:1px dashed var(--b)}.quizQ:last-child{border-bottom:0}.quizQ b{display:block;margin-bottom:6px}.quizOpt{display:flex;gap:7px;align-items:flex-start;margin:5px 0;padding:5px 7px;border-radius:8px}.quizOpt:hover{background:color-mix(in srgb,var(--b) 38%,transparent)}.quizResult{padding:8px 10px;border-radius:9px;margin-top:8px;border:1px solid var(--b)}.quizResult.good{border-color:var(--g);background:color-mix(in srgb,var(--g) 9%,var(--c))}.quizResult.bad{border-color:#d63031;background:color-mix(in srgb,#d63031 6%,var(--c))}
.graphWrap{position:relative;overflow:auto;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--a) 10%,transparent),transparent 32%),var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;min-height:580px}.graphCanvas{position:relative;min-width:980px;min-height:760px}.graphSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.graphNode{position:absolute;width:150px;padding:9px 10px;border-radius:13px;border:1px solid var(--b);background:color-mix(in srgb,var(--c) 94%,var(--a));box-shadow:0 5px 15px rgba(30,40,90,.07);cursor:pointer;transition:transform .18s,box-shadow .18s}.graphNode:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 10px 25px rgba(30,40,90,.13)}.graphNode b{display:block;font-size:12px}.graphNode small{font-size:10px}.graphNode.mastered{border-color:var(--g);box-shadow:0 0 0 2px color-mix(in srgb,var(--g) 20%,transparent)}.graphEdge{stroke:var(--b);stroke-width:1.5;opacity:.8}.graphEdge.active{stroke:var(--a);stroke-width:2.4}
.meter{height:10px;border-radius:99px;background:var(--b);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g));border-radius:99px;transition:width .5s ease}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.panel{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:11px;margin:8px 0}.panel h3,.panel h4{margin-top:0}
.hsgMission{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:9px;border:1px solid var(--b);border-radius:12px;margin:7px 0;background:var(--c)}.missionIcon{font-size:22px}.missionStatus{font-size:12px;color:var(--m)}
.timer{font:800 34px ui-monospace,Menlo,Consolas,monospace;text-align:center;padding:12px;border-radius:14px;background:var(--c);border:1px solid var(--b);letter-spacing:1px}.timer.run{border-color:var(--a);animation:glow 1s ease infinite}
.mistakeItem{border:1px solid var(--b);border-left:5px solid #d63031;border-radius:12px;padding:10px;margin:7px 0;background:var(--c)}.mistakeItem.resolved{border-left-color:var(--g);opacity:.75}.mistakeMeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.mistakeMeta b{font-size:13px}.mistakeBody{margin-top:5px;font-size:13px}.mistakeCode{margin-top:6px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--b);padding:7px;border-radius:8px;max-height:140px;overflow:auto}
.badgeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.badgeCard{padding:10px;border:1px solid var(--b);border-radius:12px;background:var(--c)}.badgeCard.locked{opacity:.48}.badgeCard b{display:block}.badgeIcon{font-size:25px;float:left;margin-right:9px}
.quickChip{display:inline-flex;gap:5px;align-items:center;padding:5px 8px;border:1px solid var(--b);border-radius:999px;margin:3px;background:var(--c);font-size:12px;cursor:pointer}.quickChip:hover{border-color:var(--a);transform:translateY(-1px)}
.studyPulse{animation:glow 1.3s ease infinite}.fadeList>div{animation:rise .24s ease both}
@media(max-width:620px){.statgrid{grid-template-columns:repeat(2,1fr)}.ktoolbar{grid-template-columns:1fr}.twoCol{grid-template-columns:1fr}.badgeGrid{grid-template-columns:1fr}.graphWrap{min-height:520px}.graphCanvas{min-width:900px}}



/* ===== PHASE 3: Judge / submissions / stress test ===== */
.p3Hero{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 12%,var(--c)),var(--c));border:1px solid var(--b);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 10px 28px rgba(30,40,90,.07)}
.p3Grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.p3Card{background:var(--c);border:1px solid var(--b);border-radius:13px;padding:10px;text-align:center}.p3Card b{display:block;font-size:20px}.p3Card small{display:block}
.serverBadge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;border:1px solid var(--b);background:var(--c)}.serverBadge.live{border-color:var(--g);background:color-mix(in srgb,var(--g) 10%,var(--c))}.serverBadge.local{border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,var(--c))}.serverBadge.off{border-color:#d63031;background:color-mix(in srgb,#d63031 7%,var(--c))}
.subTable{display:grid;gap:7px}.subRow{display:grid;grid-template-columns:70px 1fr auto;gap:9px;align-items:center;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:9px}.subVerdict{font-weight:900;font-size:12px}.subVerdict.AC{color:var(--g)}.subVerdict.WA,.subVerdict.CE,.subVerdict.RE,.subVerdict.TLE{color:#d63031}.subMeta b{display:block}.subMeta small{display:block}.subScore{text-align:right;font-weight:800}.hiddenPill{display:inline-block;font-size:10px;padding:2px 6px;border-radius:999px;background:var(--b);margin-left:4px}
.testResult{border:1px dashed var(--b);border-radius:10px;padding:8px;margin:6px 0}.testResult.pass{border-color:var(--g);background:color-mix(in srgb,var(--g) 7%,var(--c))}.testResult.fail{border-color:#d63031;background:color-mix(in srgb,#d63031 6%,var(--c))}.testDots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.testDot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--b);font-size:9px;background:var(--c)}.testDot.pass{border-color:var(--g)}.testDot.fail{border-color:#d63031}
.stressBox{margin-top:10px;border:1px solid var(--b);border-radius:13px;padding:10px;background:color-mix(in srgb,var(--a) 4%,var(--c))}.stressLog{max-height:230px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--c);border:1px solid var(--b);border-radius:9px;padding:8px}
.rateBox{padding:9px;border-radius:10px;background:var(--b);font-size:12px}.judgeServer{border-color:var(--a)!important}.judgeServer.ac{border-color:var(--g)!important}
@media(max-width:620px){.p3Grid{grid-template-columns:1fr}.subRow{grid-template-columns:58px 1fr}.subScore{text-align:left;grid-column:2}}



/* ===== PHASE 4: ADVANCED C++ IDE ===== */
.ideShell{display:grid;grid-template-rows:auto auto 1fr auto;background:var(--c);border:1px solid var(--b);border-radius:16px;overflow:hidden;margin:10px 0;box-shadow:0 12px 34px rgba(25,35,85,.10)}
.ideTop{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--b);background:color-mix(in srgb,var(--b) 18%,var(--c))}
.ideBrand{font-weight:800;margin-right:4px}.ideTop select{padding:6px 8px;font-size:12px}.ideTop input{padding:6px 8px;font-size:12px;max-width:140px}.ideTool{padding:6px 8px;font-size:12px}.ideTool.active{border-color:var(--a);background:color-mix(in srgb,var(--a) 9%,var(--c))}

0:[['Khung chương trình và nhập xuất','<p>Mọi bài đều bắt đầu từ khung này. <code>int</code> chứa tối đa khoảng 2·10⁹, tổng lớn thì dùng <code>long long</code>. Hai dòng sync giúp đọc nhập nhanh.</p><pre>#include &lt;bits/stdc++.h&gt;\nusing namespace std;\nint main(){\n  ios::sync_with_stdio(0);cin.tie(0);\n  long long n; cin&gt;&gt;n;\n  if(n%2==0) cout&lt;&lt;"EVEN\\n";\n  else cout&lt;&lt;"ODD\\n";\n}</pre>']],
1:[['vector, sort, map trong một phút','<pre>vector&lt;int&gt; a(n);\nfor(auto&amp; x:a) cin&gt;&gt;x;\nsort(a.begin(),a.end());       // O(n log n)\nmap&lt;int,int&gt; cnt;\nfor(int x:a) cnt[x]++;         // đếm tần suất\nset&lt;int&gt; s(a.begin(),a.end()); // giá trị phân biệt</pre><p><code>pair</code> so sánh theo first rồi second. Comparator riêng:</p><pre>sort(v.begin(),v.end(),[](auto&amp; x,auto&amp; y){\n  return x.second&gt;y.second;\n});</pre>']],
2:[['Big-O và prefix sum','<p>Quy tắc nhanh: khoảng 10⁸ phép tính mỗi giây. Với n = 10⁵, O(n²) = 10¹⁰ sẽ TLE, cần xuống O(n log n) hoặc O(n).</p><pre>p[0]=0;\nfor(int i=1;i&lt;=n;i++) p[i]=p[i-1]+a[i];\n// tổng a[l..r] = p[r]-p[l-1], mỗi truy vấn O(1)</pre><p>Hai con trỏ: mảng đã sắp xếp, đặt i ở đầu, j ở cuối, so sánh a[i]+a[j] với K để dịch i hoặc j.</p>']]};

3:[['Đệ quy, quay lui, bitmask','<p>Hàm đệ quy cần: trạng thái, điều kiện dừng, các lựa chọn. Quay lui = chọn, đệ quy, hoàn tác. Pruning: bỏ sớm nhánh chắc chắn vô nghiệm.</p><pre>void gen(int i){               // sinh xâu nhị phân độ dài n\n  if(i==n){ /* xử lý a */ return; }\n  for(int v=0;v&lt;2;v++){ a[i]=v; gen(i+1); }\n}\n// hoán vị: do{...}while(next_permutation(a.begin(),a.end()));\n// tập con: for(int m=0;m&lt;(1&lt;&lt;n);m++) if(m&gt;&gt;i&amp;1) /* chọn i */;</pre>']],
4:[['GCD, sàng, lũy thừa nhanh','<pre>ll gcd(ll a,ll b){return b?gcd(b,a%b):a;}   // O(log)\n// sàng: for(i=2;i*i&lt;=n;i++) if(p[i])\n//         for(j=i*i;j&lt;=n;j+=i) p[j]=0;\nll pw(ll a,ll b,ll m){ll r=1;a%=m;\n  for(;b;b&gt;&gt;=1,a=a*a%m) if(b&amp;1) r=r*a%m; return r;}\n// nghịch đảo mod nguyên tố m: pw(a,m-2,m)</pre><p>Phân tích thừa số: chia lần lượt từ 2 đến √n, phần còn lại &gt; 1 là một số nguyên tố.</p>']],
5:[['DSU và Fenwick tree','<pre>int f(int x){return p[x]==x?x:p[x]=f(p[x]);}\nvoid un(int a,int b){a=f(a);b=f(b);if(a!=b)p[a]=b;}\nvoid add(int i,ll v){for(;i&lt;=n;i+=i&amp;-i)t[i]+=v;}\nll sum(int i){ll s=0;for(;i;i-=i&amp;-i)s+=t[i];return s;}\n// tổng [l,r] = sum(r)-sum(l-1), mỗi thao tác O(log n)</pre><p>Brute force mỗi truy vấn O(n) với 10⁵ truy vấn sẽ TLE: hãy nghĩ tới cấu trúc dữ liệu.</p>']],
6:[['BFS và DFS','<pre>queue&lt;int&gt; q; fill(d,d+n+1,-1); d[s]=0; q.push(s);\nwhile(!q.empty()){int u=q.front();q.pop();\n  for(int v:g[u]) if(d[v]&lt;0){d[v]=d[u]+1;q.push(v);}}</pre><p>BFS cho đường ngắn nhất trên đồ thị không trọng số. DFS dùng để đếm thành phần liên thông, tìm chu trình, tô hai màu. Trên lưới dùng dx[]={1,-1,0,0}, dy[]={0,0,1,-1}.</p>']],
7:[['Dijkstra và các thuật toán đường đi','<pre>priority_queue&lt;pair&lt;ll,int&gt;,vector&lt;pair&lt;ll,int&gt;&gt;,greater&lt;&gt;&gt; pq;\nd[s]=0; pq.push({0,s});\nwhile(!pq.empty()){auto[du,u]=pq.top();pq.pop();if(du&gt;d[u])continue;\n  for(auto[v,w]:g[u]) if(d[u]+w&lt;d[v]){d[v]=d[u]+w;pq.push({d[v],v});}}</pre><p>Trọng số không âm: Dijkstra O(m log n). Có cạnh âm: Bellman-Ford. Trọng số 0/1: BFS với deque. Mọi cặp đỉnh, n ≤ 400: Floyd. Cây khung nhỏ nhất: Kruskal = sắp xếp cạnh + DSU.</p>']],
8:[['Cây và LCA (binary lifting)','<pre>up[v][0]=cha; for(j=1;j&lt;LOG;j++) up[v][j]=up[up[v][j-1]][j-1];\nint lca(int a,int b){ if(dep[a]&lt;dep[b])swap(a,b);\n  for(int j=LOG-1;j&gt;=0;j--) if(dep[a]-(1&lt;&lt;j)&gt;=dep[b]) a=up[a][j];\n  if(a==b)return a;\n  for(int j=LOG-1;j&gt;=0;j--) if(up[a][j]!=up[b][j]) a=up[a][j],b=up[b][j];\n  return up[a][0];}\n// dist(a,b)=dep[a]+dep[b]-2*dep[lca(a,b)]</pre><p>Đường kính: DFS từ đỉnh bất kỳ tới điểm xa nhất u, rồi DFS từ u. Euler tour (tin/tout) biến cây thành mảng để dùng Fenwick.</p>']],
9:[['Quy hoạch động: nghĩ theo trạng thái','<p>Bốn câu hỏi: dp[...] nghĩa là gì, công thức chuyển, trường hợp cơ sở, thứ tự tính. Ví dụ đổi tiền ít xu nhất:</p><pre>dp[0]=0;\nfor(int x=1;x&lt;=S;x++){ dp[x]=INF;\n  for(int c:coins) if(x&gt;=c) dp[x]=min(dp[x],dp[x-c]+1); }</pre><p>Knapsack 0/1: duyệt vật, rồi duyệt sức chứa từ lớn về nhỏ. LIS O(n log n): giữ mảng đuôi nhỏ nhất và dùng lower_bound.</p>']],
10:[['Bitmask DP và DP chữ số','<pre>// dp[m] = chi phí nhỏ nhất khi tập m đã xử lý xong\nfor(int m=0;m&lt;(1&lt;&lt;n);m++) for(int i=0;i&lt;n;i++) if(!(m&gt;&gt;i&amp;1))\n  dp[m|1&lt;&lt;i]=min(dp[m|1&lt;&lt;i],dp[m]+cost(m,i));</pre><p>Dùng khi n ≤ 20. DP chữ số: dp[vị trí][trạng thái][đang sát giới hạn?]. Interval DP: dp[l][r] tính từ đoạn ngắn đến đoạn dài.</p>']],
11:[['KMP và hashing','<pre>vector&lt;int&gt; pi(n);\nfor(int i=1;i&lt;n;i++){int k=pi[i-1];\n  while(k&amp;&amp;s[i]!=s[k])k=pi[k-1];\n  if(s[i]==s[k])k++; pi[i]=k;}\n// khớp mẫu p trong t: tính pi của p+"#"+t, pi[i]==|p| là một vị trí khớp</pre><p>Hash: H[i]=H[i-1]*B+s[i] (mod), so sánh hai đoạn trong O(1). Trie: cây tiền tố cho tập xâu.</p>']],
12:[['Segment tree và lazy','<pre>void upd(int o,int l,int r,int i,ll v){\n  if(l==r){t[o]=v;return;} int m=(l+r)/2;\n  i&lt;=m?upd(2*o,l,m,i,v):upd(2*o+1,m+1,r,i,v);\n  t[o]=t[2*o]+t[2*o+1];}\nll qry(int o,int l,int r,int a,int b){\n  if(a&gt;r||b&lt;l)return 0; if(a&lt;=l&amp;&amp;r&lt;=b)return t[o];\n  int m=(l+r)/2; return qry(2*o,l,m,a,b)+qry(2*o+1,m+1,r,a,b);}</pre><p>Cập nhật đoạn: thêm mảng lz, đánh dấu chờ ở nút phủ trọn đoạn và đẩy xuống con khi cần đi sâu. Sparse table cho RMQ không cập nhật: dựng O(n log n), hỏi O(1).</p>']],
13:[['SCC và luồng cực đại','<p>Kosaraju: DFS lần 1 ghi thứ tự thoát; DFS lần 2 trên đồ thị đảo theo thứ tự thoát giảm dần, mỗi cây DFS là một SCC. Co các SCC thành DAG rồi chạy DP hoặc topo sort.</p><p>Luồng cực đại (Dinic): BFS dựng đồ thị mức, DFS đẩy luồng chặn; cắt nhỏ nhất bằng luồng cực đại. Ghép cặp hai phía: nguồn nối vế trái, vế phải nối đích, mọi cạnh dung lượng 1.</p>']]});

14:[['Euler phi, Euclid mở rộng, CRT','<pre>int phi(int n){int r=n;\n  for(int p=2;p*p&lt;=n;p++) if(n%p==0){while(n%p==0)n/=p; r-=r/p;}\n  if(n&gt;1) r-=r/n; return r;}\n// Euler: a^phi(m) ≡ 1 (mod m) khi gcd(a,m)=1\n// extgcd: ax+by=g, nếu g=1 thì x mod m là nghịch đảo của a</pre><p>CRT ghép x≡a1 (m1) và x≡a2 (m2) bằng Euclid mở rộng. Lucas tính C(n,k) mod p nhỏ. Ma trận mũ tính số hạng thứ 10¹⁸ của dãy truy hồi trong O(k³ log n). Sàng tuyến tính cho các hàm nhân tính.</p>']],
15:[['Tổ hợp modulo','<pre>fact[0]=1; for(i=1;i&lt;=N;i++) fact[i]=fact[i-1]*i%M;\ninv[N]=pw(fact[N],M-2,M);\nfor(i=N;i&gt;0;i--) inv[i-1]=inv[i]*i%M;\nll C(int n,int k){return k&lt;0||k&gt;n?0:fact[n]*inv[k]%M*inv[n-k]%M;}</pre><p>Stars and bars: chia n vật vào k hộp có C(n+k-1,k-1) cách. Bao hàm-loại trừ: duyệt tập con các điều kiện bị vi phạm với dấu (-1)^|S|. Catalan C(2n,n)/(n+1) đếm dãy ngoặc đúng.</p>']],
16:[['Meet-in-the-middle, sqrt, Mo','<p>Meet-in-the-middle: chia phần tử làm hai nửa, mỗi nửa 2^(n/2) trạng thái, ghép bằng sort và hai con trỏ. Sqrt decomposition: chia mảng thành khối cỡ √n, mỗi thao tác O(√n). Mo: sắp truy vấn offline theo (l/B, r), dịch hai đầu đoạn, tổng O((n+q)√n).</p><pre>sort(qs.begin(),qs.end(),[&amp;](auto&amp; a,auto&amp; b){\n  return a.l/B!=b.l/B ? a.l&lt;b.l : a.r&lt;b.r;});\n// while(L&gt;l)add(--L); while(R&lt;=r)add(R++);\n// while(L&lt;l)del(L++); while(R&gt;r+1)del(--R);</pre>']],
17:[['Quy trình giải bài và stress test','<p>Đọc đề, gạch constraint, tìm brute force, tìm bottleneck, nhận dạng mẫu, chứng minh, code, test. Trước khi nộp hãy thử n=1, toàn giá trị bằng nhau, giá trị lớn nhất (kiểm tra tràn số). Khi WA: viết brute và generator ngẫu nhiên rồi so sánh output.</p><pre>for i in $(seq 1 1000); do\n  ./gen $i &gt; in; ./sol &lt; in &gt; o1; ./brute &lt; in &gt; o2\n  cmp -s o1 o2 || break\ndone</pre>']],
18:[['HSG: chiến thuật làm đề','<p>Đọc hết đề, làm bài chắc điểm trước. Mỗi bài lấy điểm subtask và brute force (n nhỏ, trường hợp đặc biệt) rồi mới tối ưu. Chừa 15 phút cuối để kiểm tra tràn số và chạy lại test mẫu. Đề HSG thường đọc ghi file:</p><pre>freopen("TEN.INP","r",stdin);\nfreopen("TEN.OUT","w",stdout);</pre><p>Xây template cá nhân: nhập xuất nhanh, DSU, Fenwick, Dijkstra, gcd/pw, tổ hợp mod.</p>']],
19:[['Tự tạo lời giải','<p>Gặp bài lạ: thử n nhỏ bằng tay, viết brute để quan sát quy luật, đặt giả thuyết rồi tìm phản ví dụ. Đưa bài về mô hình quen (đồ thị, DP, đếm, tham lam). Tự hỏi: có bất biến nào? đổi thứ tự xét được không? chặt nhị phân đáp án được không? Có thuật toán rồi thì chứng minh tính đúng và đối chiếu độ phức tạp với giới hạn.</p>']],
20:[['Từ bài toán đến thuật toán','<p>Chuỗi: Problem, Observation, Model, Algorithm, Proof, Implementation, Optimization. Level này không có giáo trình cố định: đọc editorial khó rồi viết lại bằng lời của mình, tự ra đề, tự viết lời giải. Thước đo là một bài chưa từng thấy vẫn có hướng tấn công.</p>']]});

function ensure20(){for(let lv=0;lv<L.length;lv++){let ps=P.filter(p=>p[0]===lv);const cnt={e:ps.filter(p=>p[1]==='e').length,m:ps.filter(p=>p[1]==='m').length,h:ps.filter(p=>p[1]==='h').length};let target=Math.max(20,ps.length);let i=0;while((ps.length+i<target)||cnt.e<5||cnt.m<2||cnt.h<1){let d=genDiff[i%genDiff.length];if(cnt[d]>=({e:5,m:2,h:1}[d]||0)&&ps.length+i>=20)d=['e','m','h'][i%3];const bank=EXTRA_KIND[lv]||EXTRA_KIND[20];const kind=bank[i%bank.length];const id=P.length;const pack=(EXTRA_PACK[kind]||(()=>J[0]))();const sm=pack[0]||['',''];const q=Object.assign([lv,d,`LV${lv} · ${EXTRA_DESC[kind]||'Bài luyện tổng hợp'} #${i+1}`,`${EXTRA_RULE[kind]||'Bài luyện tăng cường theo chủ đề level này.'} Hệ thống chấm bằng compile + test, không so sánh source code.`,'','',null],{id,gen:true,genKind:kind});q[4]=String(sm[0]??'').replace(/\\n/g,'\\n');q[5]=String(sm[1]??'').replace(/\\n/g,'\\n');P.push(q);cnt[d]++;i++}}}

let cppCompiler=null;
async function getCppCompiler(){
  if(cppCompiler)return cppCompiler;
  if(S.cppCompiler)return cppCompiler=S.cppCompiler;
  const r=await fetch('https://wandbox.org/api/list.json',{cache:'no-store'});
  if(!r.ok)throw new Error('Không lấy được danh sách compiler.');
  const a=await r.json();
  const cs=a.filter(x=>String(x.language||'').toLowerCase().includes('c++'));
  const pick=cs.find(x=>x.name==='gcc-head')||cs.find(x=>/^gcc/i.test(x.name))||cs[0];
  if(!pick)throw new Error('Wandbox hiện không có compiler C++.');
  cppCompiler=pick.name;S.cppCompiler=pick.name;sv();return cppCompiler;
}
async function runCpp(code,stdin,standard='20'){
  const compiler=await getCppCompiler();
  const body={compiler,code,stdin,options:{compilerOptions:[`-std=c++${String(standard||'20')}`]}};
  const r=await fetch('https://wandbox.org/api/compile.json',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Compiler trả về HTTP '+r.status+'.');
  const x=await r.json();
  const ce=[x.compiler_error,x.compiler_message].filter(Boolean).join('\n').trim();
  const pe=[x.program_error,x.program_message].filter(Boolean).join('\n').trim();
  const out=String(x.program_output??'');
  return {ok:Number(x.status)===0&&!x.signal&&!ce,out,ce,pe,status:x.status,signal:x.signal,runtime:Number(x.status)!==0||!!x.signal};
}

async function submitProblemLocal(id,guestMode=false){
  if(judgeBusy)return;
  const p=P[id],code=S.code[id]??TPL,pack=testPack(p);
  judgeBusy=true;ms='';judgeState='wait';S.lastError='';S.attempts[id]=(S.attempts[id]||0)+1;sv();R();
  const results=[];
  try{
    if(!code.trim()){judgeState='wa';S.lastError='Chưa có code để nộp.';return;}
    if(!pack){judgeState='unavailable';ms='Bài này chưa có bộ test tích hợp trong bản local.';return;}
    for(let i=0;i<pack.length;i++){
      const z=await runCpp(code,pack[i][0],ideGetProfileStandard());
      results.push({i,ok:z.ok,stdout:z.out||'',error:z.ce||z.pe||'',status:z.status,signal:z.signal});
      if(!z.ok){S.lastError=z.ce||z.pe||'Chương trình dừng bất thường.';judgeState=z.ce?'ce':(z.signal?'re':'wa');break;}
      if(norm(z.out)!==norm(pack[i][1])){judgeState='wa';break;}
    }
    if(results.length===pack.length&&results.every((r,i)=>r.ok&&norm(r.stdout)===norm(pack[i][1]))){
      judgeState='ac';
      if(guestMode){
        awardAfterAC(p);
        ms='✅ AC local · EXP chỉ có giá trị cục bộ. Đăng nhập + deploy judge server để EXP có tính tin cậy.';logAppActivity('submission_local_accepted',{problem_id:Number(id)});
      }
    }else if(['wa','ce','re'].includes(judgeState)){
      recordMistake('judge',p[2],`${judgeState.toUpperCase()} · ${S.lastError||'Một hoặc nhiều test chưa đúng.'}`,String(id));
    }
    S.localSubmissions=Array.isArray(S.localSubmissions)?S.localSubmissions:[];
    S.localSubmissions.unshift({id:crypto?.randomUUID?.()||String(Date.now()+Math.random()),problem_id:id,problem:p[2],verdict:judgeState.toUpperCase(),passed:results.filter((r,i)=>r.ok&&norm(r.stdout)===norm(pack[i][1])).length,total:pack.length,created_at:new Date().toISOString(),server:false});
    if(contestActive()){S.contest.localSubmissions=S.contest.localSubmissions||[];S.contest.localSubmissions.push({contest_id:S.contest.activeId,problem_id:id,verdict:judgeState.toUpperCase()==='AC'?'ACCEPTED':judgeState.toUpperCase(),contest_elapsed_seconds:contestElapsedLocal(),created_at:new Date().toISOString()});}
    S.localSubmissions=S.localSubmissions.slice(0,100);sv();
  }catch(e){judgeState='net';S.lastError=String(e.message||e);}
  finally{judgeBusy=false;sv();R();}
}

async function runStress(id){
  if(judgeBusy)return;
  const sc=STRESS[id];
  if(!sc){ms='ℹ️ Bài này chưa có oracle stress-test tích hợp.';R();return;}
  const code=S.code[id]??TPL;
  if(!code.trim()){ms='⚠️ Chưa có code.';R();return;}
  judgeBusy=true;S.stressState={id,running:true,done:0,total:sc.cases,passed:0,failed:0,log:''};sv();R();
  try{
    for(let i=0;i<sc.cases;i++){
      const seed=sc.seed+i*7919;
      const stdin=sc.gen(seed);
      const [u,o]=await Promise.all([runCpp(code,stdin),runCpp(sc.oracle,stdin)]);
      const uok=u.ok, ook=o.ok, same=uok&&ook&&norm(u.out)===norm(o.out);
      S.stressState.done=i+1;
      if(same)S.stressState.passed++;
      else S.stressState.failed++;
      const line=`#${i+1} seed=${seed} ${same?'PASS':'FAIL'}${!uok?' · user error':''}${!ook?' · oracle error':''}`;
      S.stressState.log=(S.stressState.log?S.stressState.log+'\n':'')+line;
      if(!same){
        S.stressState.log+=`\ninput:\n${stdin}\nuser:\n${u.out||u.ce||u.pe||'(no output)'}\noracle:\n${o.out||o.ce||o.pe||'(no output)'}`;
        recordMistake('stress',P[id][2],`Stress test fail ở seed ${seed}. So sánh output với oracle.`,String(id));
        break;
      }
      sv();

function ideUpdateFind(kind,id){const key=ideKey(kind,id);const f=document.querySelector(`[data-ide-find="${CSS.escape(key)}"]`);const ta=document.querySelector(`[data-ide-textarea="${CSS.escape(key)}"]`);if(!f||!ta||!f.value)return;const q=f.value;const start=ta.selectionEnd||0;let at=ta.value.indexOf(q,start);if(at<0)at=ta.value.indexOf(q,0);if(at>=0){ta.focus();ta.setSelectionRange(at,at+q.length);ideSyncVisual(kind,id);}else ideToast('🔎 Không tìm thấy.');}
function ideReplace(kind,id,all=false){const key=ideKey(kind,id);const f=document.querySelector(`[data-ide-find="${CSS.escape(key)}"]`),r=document.querySelector(`[data-ide-replace="${CSS.escape(key)}"]`),ta=document.querySelector(`[data-ide-textarea="${CSS.escape(key)}"]`);if(!f||!ta||!f.value)return;const q=f.value,rep=r?.value??'';if(all){const count=(ta.value.match(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;ta.value=ta.value.split(q).join(rep);ta.dispatchEvent(new Event('input',{bubbles:true}));ideToast(`✅ Đã thay ${count} vị trí.`);}else{const at=ta.selectionStart<ta.selectionEnd?ta.selectionStart:ta.value.indexOf(q,ta.selectionEnd);if(at>=0){ta.setRangeText(rep,at,at+q.length,'end');ta.dispatchEvent(new Event('input',{bubbles:true}));ideUpdateFind(kind,id);}else ideToast('🔎 Không còn vị trí phù hợp.');}}
function ideGoto(kind,id){const key=ideKey(kind,id),n=Math.max(1,Number(document.querySelector(`[data-ide-goto="${CSS.escape(key)}"]`)?.value)||1),ta=document.querySelector(`[data-ide-textarea="${CSS.escape(key)}"]`);if(!ta)return;let pos=0,lines=ta.value.split('\n');for(let i=0;i<Math.min(lines.length,n)-1;i++)pos+=lines[i].length+1;ta.focus();ta.setSelectionRange(pos,pos);ideSyncVisual(kind,id);}
function ideFormat(kind,id){
  const w=ideWorkspace(kind,id),name=w.active;if(!IDE_CPP_EXT.test(name)){ideToast('ℹ️ Chỉ format file C++/header.');return;}
  const ta=document.querySelector(`[data-ide-textarea="${CSS.escape(ideKey(kind,id))}"]`);if(!ta)return;
  const src=ta.value.split('\n'),out=[];let level=0;
  for(let raw of src){let line=raw.trim();if(!line){out.push('');continue;}if(/^[}\)\]]/.test(line))level=Math.max(0,level-1);out.push('  '.repeat(level)+line);const opens=(line.match(/\{/g)||[]).length,closes=(line.match(/\}/g)||[]).length;level=Math.max(0,level+opens-closes);}
  ta.value=out.join('\n');ta.dispatchEvent(new Event('input',{bubbles:true}));ideToast('✨ Đã format indentation cơ bản.');
}

function ideFont(delta){S.ide.fontSize=Math.min(18,Math.max(12,(S.ide.fontSize||13)+delta));sv();R();}

function ideSetTheme(v){S.ide.theme=v;const root=document.documentElement;if(v==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',v);sv();}

function ideRun(kind,id){const w=ideWorkspace(kind,id);if(!IDE_CPP_EXT.test(w.active)){ideToast('⚠️ File hiện tại không phải mã C++.');return;}if(kind==='free')runFreeFromIDE();else runVisibleTests(id);}
async function runFreeFromIDE(){if(freeBusy)return;const w=ideWorkspace('free');const code=w.files[w.active]??'';const input=String(w.files['input.txt']??'');freeBusy=true;S.freeState='run';S.freeOutput='⏳ Compiling…';sv();ideSyncVisual('free');try{const z=await runCpp(code,input,ideGetProfileStandard());S.freeState=z.ok?'ok':'err';S.freeOutput=z.ok?(z.out||'(stdout rỗng)'):(z.ce||z.pe||('Program stopped: '+z.status));}catch(e){S.freeState='err';S.freeOutput='Không thể kết nối compiler: '+String(e.message||e);}finally{freeBusy=false;sv();R();}}
async function runVisibleTests(id){if(judgeBusy)return;const p=P[Number(id)],pack=testPack(p);if(!pack){ideToast('ℹ️ Bài này chưa có visible test pack.');return;}const w=ideWorkspace('problem',id),code=String(w.files['solution.cpp']??TPL);if(!code.trim()){ideToast('⚠️ Chưa có solution.cpp.');return;}judgeBusy=true;S.stressState={id,visible:true,running:true,done:0,total:pack.length,passed:0,failed:0,log:''};judgeState='wait';sv();R();try{for(let i=0;i<pack.length;i++){const z=await runCpp(code,pack[i][0],ideGetProfileStandard());S.stressState.done=i+1;if(z.ok&&norm(z.out)===norm(pack[i][1]))S.stressState.passed++;else{S.stressState.failed++;S.stressState.log+=`TEST ${i+1} FAIL\nINPUT:\n${pack[i][0]}\nOUTPUT:\n${z.out||z.ce||z.pe||''}\nEXPECTED:\n${pack[i][1]}\n`;break;}sv();}S.stressState.running=false;ms=S.stressState.failed?'❌ Visible test thất bại.':'✅ Visible tests PASSED.';}catch(e){S.stressState.running=false;ms='⚠️ Test runner lỗi: '+String(e.message||e);}finally{judgeBusy=false;sv();R();}}

}
async function loadIdeCloud(){
  if(!supabaseClient||!cloudUser)return;
  try{const q=await supabaseClient.from('profiles').select('ide_state').eq('id',cloudUser.id).maybeSingle();if(q.error||!q.data?.ide_state)return;const d=q.data.ide_state;if(d&&typeof d==='object'){S.ide={...S.ide,...d,workspaces:d.workspaces&&typeof d.workspaces==='object'?d.workspaces:S.ide.workspaces};ensureIdeState();sv();}}catch(_e){}
}
async function syncPhase4Cloud(){
  if(!supabaseClient||!cloudUser)return;
  const now=Date.now();if(now-(S.ideSyncAt||0)<500)return;S.ideSyncAt=now;
  try{const q=await supabaseClient.from('profiles').update({ide_state:S.ide,updated_at:new Date().toISOString()}).eq('id',cloudUser.id);if(q.error&&!/column .* does not exist|schema cache/i.test(q.error.message||''))cloudMessage='⚠️ Không đồng bộ IDE: '+q.error.message;}catch(_e){}
}

const TOPIC_MORE={"0-1 BFS": {"title": "Shortest path với cạnh 0/1", "explain": "Khi mọi cạnh chỉ có trọng số 0 hoặc 1, deque thay cho priority_queue. Cạnh 0 được đưa lên đầu vì không làm tăng khoảng cách; cạnh 1 đưa xuống cuối. Đây là phiên bản chuyên biệt của shortest path.", "example": "Ví dụ s-\\>a cost 0, a-\\>b cost 1, s-\\>b cost 1. Từ s ta có dist[a]=0 rồi dist[b]=1.", "code": "deque<int> dq; dist[s]=0; dq.push_front(s);;while(!dq.empty()){int u=dq.front();dq.pop_front();for(auto [v,w]:g[u])if(dist[v]>dist[u]+w){dist[v]=dist[u]+w;if(w==0)dq.push_front(v);else dq.push_back(v);}}", "complexity": "O(n+m), vì mỗi relax và dịch deque có thể phân tích amortized tuyến tính trong biến thể chuẩn.", "pitfalls": "Chỉ dùng khi w thuộc {0,1}; kiểm tra lại invariant dist của deque.", "check": "Tự sửa code để in cả đường đi ngắn nhất s->t."}, "Aho-Corasick": {"title": "Nhiều pattern trong một text", "explain": "Xây một trie chứa toàn bộ pattern rồi tạo fail link bằng BFS. Fail link nói rằng nếu tiếp tục từ node hiện tại không được thì chuyển tới suffix dài nhất vẫn là prefix của một pattern. Khi quét text, một lần đi qua có thể phát hiện nhiều pattern.", "example": "Patterns he, she, his, hers trong text ushers cho nhiều lần match trong cùng một lượt quét.", "code": "// 1) insert patterns; 2) BFS build fail; 3) scan text; u=go(u,c); 4) lấy output[u] và output[fail[u]]", "complexity": "Xấp xỉ O(tổng độ dài pattern + độ dài text + số lần match) với transition đã chuẩn bị.", "pitfalls": "Quên output của fail; alphabet mapping sai; memory quá lớn.", "check": "Tự giải thích đường fail của node \"she\" và vì sao phát hiện \"he\"."}, "Algorithm": {"title": "Thuật toán là gì", "explain": "Thuật toán là một chuỗi bước xác định biến input thành output. Không chỉ nhớ tên như Dijkstra hay DP; phải biết trạng thái, thao tác, điều kiện dừng và lý do đúng.", "example": "Ví dụ model là weighted graph không âm thì algorithm phù hợp có thể là Dijkstra: khởi tạo dist rồi lặp relax.", "code": "// Input -> initialize -> repeat deterministic step -> output", "complexity": "Ghi time và memory ngay khi chốt thuật toán.", "pitfalls": "Nói “dùng DP” hoặc “dùng graph” mà chưa định nghĩa state/model cụ thể.", "check": "Viết pseudocode 8-12 dòng cho một bài bạn vừa giải."}, "Bellman-Ford": {"title": "Shortest path có cạnh âm", "explain": "Relax toàn bộ cạnh n-1 lần. Sau n-1 lượt, mọi shortest path đơn giản đã có cơ hội truyền đủ. Nếu còn relax được ở lượt n, tồn tại negative cycle reachable.", "example": "1->2=-5, 2->3=2, 1->3=10 thì dist[3] giảm từ 10 xuống -3.", "code": "for(int i=1;i<=n-1;i++) for(auto [u,v,w]:edges) if(dist[u]!=INF) dist[v]=min(dist[v],dist[u]+w);", "complexity": "O(nm).", "pitfalls": "Cộng INF; không phân biệt negative cycle reachable với cycle ở component không tới được từ s.", "check": "Thêm một negative cycle và kiểm tra lượt relax thứ n."}, "Binary Lifting": {"title": "Nhảy tổ tiên bằng lũy thừa của 2", "explain": "Lưu up[u][j] là tổ tiên cách 2^j bước. Một bước k được tách theo các bit 1 của k. Đây là cách chuyển một truy vấn k-th ancestor từ O(k) thành O(log n).", "example": "k=13=8+4+1, vì vậy từ u nhảy 8 bước, 4 bước, 1 bước.", "code": "for(int j=1;j<LOG;j++) up[u][j]=up[up[u][j-1]][j-1];;for(int j=LOG-1;j>=0;j--) if(k>>j&1) u=up[u][j];", "complexity": "Build O(n log n), query O(log n).", "pitfalls": "LOG không đủ; root không có ancestor hợp lệ; shift vượt kiểu.", "check": "Chọn n=10^5 và tính LOG tối thiểu cần dùng."}, "Burnside": {"title": "Đếm cấu hình có đối xứng", "explain": "Số cấu hình thực sự khác nhau dưới phép đối xứng bằng trung bình số cấu hình cố định bởi từng phần tử của nhóm. Phải xác định group action và đếm fixed configurations.", "example": "Tô màu đỉnh đa giác: hai cách quay giống nhau nên không thể chỉ lấy tổng số màu^n.", "code": "orbit=(sum_fixed)/group_size;", "complexity": "Thường O(group size) lần đếm fixed, tùy bài.", "pitfalls": "Đếm fixed sai; quên phép phản xạ nếu nhóm có cả reflection; chia sai.", "check": "Với 3 vị trí và 2 màu, liệt kê fixed của phép quay 0,1,2."}, "CDQ": {"title": "CDQ divide and conquer", "explain": "CDQ xử lý đóng góp từ nửa trái sang nửa phải trong một thứ tự. Thường sort theo một tọa độ, chia theo tọa độ khác, rồi dùng Fenwick cho tọa độ còn lại. Sau khi xử lý phải rollback cấu trúc.", "example": "Đếm dominance 3D: x tăng, CDQ theo chỉ số; bên trái đóng góp cho bên phải khi y phù hợp; BIT đếm z.", "code": "// solve(l,r); solve(l,m); add left contributions into BIT; query right; rollback; solve(m+1,r)", "complexity": "Tùy bài, nhiều dạng O(n log^2 n).", "pitfalls": "Không rollback BIT; xử lý điểm trùng tọa độ sai thứ tự; CDQ không phù hợp mọi bài.", "check": "Viết invariant chính xác của BIT trong bước combine."}, "CHT": {"title": "Convex Hull Trick", "explain": "CHT giữ các đường y=mx+b và trả min hoặc max tại x. Một line có thể bị loại nếu nó không bao giờ tối ưu trên miền query. Khi slope và x đơn điệu có deque CHT; khi không, Li Chao thường an toàn hơn.", "example": "dp[i]=min_j(dp[j]+m[j]*x[i]) là mẫu nhận diện trực tiếp.", "code": "// add line m,b; query x; loại line không bao giờ tối ưu", "complexity": "Deque có thể O(1) amortized mỗi thao tác trong điều kiện đơn điệu; Li Chao O(log C).", "pitfalls": "Dùng deque khi slope/query không monotone; overflow khi so sánh giao điểm.", "check": "Từ recurrence cho trước, chỉ ra m,b,x tương ứng."}, "Code": {"title": "Implementation của lời giải", "explain": "Code là bước chuyển proof/pseudocode thành C++. Mục tiêu không phải ngắn nhất mà là giữ invariant, đúng kiểu dữ liệu và dễ kiểm tra. Nên tách helper function theo trách nhiệm.", "example": "Dijkstra có thể tách addEdge, solveDistance và reconstruct để mỗi phần kiểm tra riêng.", "code": "// input; preprocess; core; output; mỗi helper một nhiệm vụ", "complexity": "Complexity phải đúng với algorithm đã chứng minh.", "pitfalls": "Copy template không hiểu; biến tên mơ hồ; trộn input/output với thuật toán khiến debug khó.", "check": "Đối chiếu từng khối code với từng bước pseudocode."}, "Euler path": {"title": "Đường đi Euler", "explain": "Euler path đi qua mỗi cạnh đúng một lần. Với graph vô hướng liên thông theo các đỉnh có degree>0: 0 đỉnh lẻ -> có circuit; 2 đỉnh lẻ -> có path; hơn 2 -> không có.", "example": "Graph 1-2-3 có hai đỉnh lẻ nên có Euler path từ 1 tới 3.", "code": "// count odd degree; check connectivity; Hierholzer để dựng đường", "complexity": "Kiểm tra O(n+m); dựng Euler path O(m).", "pitfalls": "Nhầm Euler với Hamilton; chỉ kiểm tra degree mà quên connectivity; xử lý multi-edge sai.", "check": "Tự tạo graph có circuit và graph chỉ có path."}, "Euler tour": {"title": "Euler tour trên cây", "explain": "DFS ghi tin[u] khi vào node và tout[u] là vị trí cuối subtree. Khi root cây, toàn bộ subtree u xuất hiện liên tiếp trong order, biến subtree query thành range query.", "example": "Nếu subtree của 3 chiếm vị trí 5..9 thì tổng subtree = sum(base[5..9]).", "code": "void dfs(int u,int p){tin[u]=++timer;order[timer]=u;for(int v:g[u])if(v!=p)dfs(v,u);tout[u]=timer;}", "complexity": "Tour O(n); phần query phụ thuộc Fenwick/segment tree.", "pitfalls": "Sai parent; nhầm tout với thời điểm thoát; dùng indexing không nhất quán.", "check": "Kết hợp Euler tour + Fenwick để tính tổng subtree."}, "Floyd": {"title": "Floyd-Warshall", "explain": "DP theo số đỉnh trung gian được phép. Sau khi xử lý k, dist[i][j] là đường ngắn nhất chỉ dùng các trung gian trong {1..k}. Vì vậy k phải là vòng ngoài cùng.", "example": "Với n nhỏ, tìm shortest path giữa mọi cặp đỉnh mà không cần chạy Dijkstra n lần.", "code": "for(int k=1;k<=n;k++) for(int i=1;i<=n;i++) for(int j=1;j<=n;j++) dist[i][j]=min(dist[i][j],dist[i][k]+dist[k][j]);", "complexity": "O(n^3) time, O(n^2) memory.", "pitfalls": "INF+INF overflow; đặt vòng k không ngoài cùng; khởi tạo dist[i][i]=0 sai/đúng tùy model.", "check": "Tự giải thích ý nghĩa của dist sau k=0,k=1."}, "HLD": {"title": "Heavy-Light Decomposition", "explain": "Chia cây thành các heavy path để một đường đi từ node tới root cắt qua O(log n) chain. Ánh xạ node vào base array rồi dùng segment tree/Fenwick xử lý từng đoạn.", "example": "Query path u-v: nếu head khác nhau, xử lý chain có head sâu hơn rồi nhảy u lên parent[head[u]].", "code": "while(head[u]!=head[v]){if(dep[head[u]]<dep[head[v]])swap(u,v);query(pos[head[u]],pos[u]);u=parent[head[u]];}", "complexity": "Path query thường O(log^2 n) với segment tree cơ bản.", "pitfalls": "Tách heavy child sai; mapping pos sai; quên xử lý đoạn cuối khi cùng chain.", "check": "Vẽ chain cho một cây 8 đỉnh trước khi code."}, "Lucas": {"title": "Định lý Lucas", "explain": "Với p nguyên tố, C(n,k) mod p bằng tích C(n_i,k_i) mod p của các chữ số n,k trong cơ số p. Nhờ đó n rất lớn nhưng p nhỏ vẫn xử lý được.", "example": "C(100,7) mod 3: đổi 100 và 7 sang cơ số 3 rồi dùng từng chữ số.", "code": "long long lucas(n,k,p){if(k==0)return 1;return C(n%p,k%p,p)*lucas(n/p,k/p,p)%p;}", "complexity": "Khoảng O(p log_p n) sau khi precompute factorial tới p-1.", "pitfalls": "Dùng cho modulus composite; quên trường hợp k_i>n_i -> 0.", "check": "Làm tay một ví dụ với p=3."}, "Model": {"title": "Mô hình hóa bài toán", "explain": "Model là cấu trúc toán học/CS đại diện cho đề: graph, tree, interval, state machine, flow, set, counting... Chọn model đúng thường giúp thuật toán xuất hiện tự nhiên.", "example": "Maze -> grid graph; quan hệ phụ thuộc -> DAG; thao tác gộp đoạn -> interval DP.", "code": "// Problem statement -> mathematical model -> data representation", "complexity": "Complexity được phân tích sau khi có model.", "pitfalls": "Ép bài vào model quen dù có trọng số/hướng/điều kiện khác; mất thông tin quan trọng khi mô hình hóa.", "check": "Lấy 5 đề và ghi model cho từng đề bằng một câu."}, "O(n)": {"title": "Độ phức tạp tuyến tính", "explain": "O(n) nghĩa là số thao tác tăng tỷ lệ với kích thước input. Đây thường là mục tiêu cho n rất lớn. Hai vòng for không luôn là O(n²) nếu tổng số lần lặp của chúng chỉ O(n).", "example": "Duyệt mảng một lần để tìm max là O(n). Duyệt bằng hai con trỏ cũng thường O(n) vì mỗi pointer chỉ đi về phía trước.", "code": "long long mx=LLONG_MIN;for(long long x:a)mx=max(mx,x);", "complexity": "Time O(n), memory thường O(1) ngoài input.", "pitfalls": "Đánh giá O(n) chỉ nhìn số dòng code; bỏ qua hàm được gọi bên trong.", "check": "Cho một đoạn code và chứng minh số lần mỗi phần tử được chạm tới."}, "Observation": {"title": "Observation quan trọng", "explain": "Observation là tính chất làm giảm không gian tìm kiếm hoặc biến đổi cách nhìn bài. Observation phải được phát biểu thành một mệnh đề có lý do, không phải “cảm giác đúng”.", "example": "Mảng sort và cần cặp tổng K: nếu a[i]+a[j]<K thì giảm j không thể tăng tổng, vì vậy tăng i là an toàn.", "code": "// if X then move/merge/update Y because property Z", "complexity": "Một observation tốt thường làm giảm complexity.", "pitfalls": "Tin vào observation vì sample; không tìm phản ví dụ.", "check": "Mỗi observation viết kèm một phản ví dụ bạn đã cố tìm."}, "Problem": {"title": "Xác định chính xác bài cần giải", "explain": "Trước khi chọn thuật toán, phải biến lời văn thành target toán học: cần tìm, đếm hay tối ưu gì; miền chỉ số nào; điều kiện gì; có phân biệt thứ tự không.", "example": "“Đếm cặp i<j có a[i]+a[j]=K” xác định rõ unordered pair và điều kiện index.", "code": "// Given a,n,K -> count pairs (i,j) satisfying i<j and a[i]+a[j]=K", "complexity": "Chưa có complexity; đây là bước định nghĩa mục tiêu.", "pitfalls": "Nhầm pair ordered/unordered; nhầm subarray/subsequence/substring.", "check": "Tóm tắt một đề bằng một câu toán học duy nhất."}, "Proof": {"title": "Chứng minh tính đúng", "explain": "Proof cần cho thấy mọi input hợp lệ đều cho đáp án đúng. Có thể dùng invariant, induction, exchange argument, cut property hoặc contradiction tùy dạng bài.", "example": "Greedy interval chọn end nhỏ nhất: thay lựa chọn đầu của nghiệm tối ưu bằng interval kết thúc sớm hơn không làm giảm số interval còn lại.", "code": "// Claim -> Lemma/Invariant -> Reason -> Conclusion", "complexity": "Proof không thay đổi complexity nhưng quyết định độ tin cậy thuật toán.", "pitfalls": "Dùng sample làm proof; chỉ chứng minh một trường hợp; bỏ qua edge case.", "check": "Viết proof 5-8 câu cho BFS shortest path."}, "Z-function": {"title": "Z function", "explain": "Z[i] là độ dài lớn nhất mà substring bắt đầu ở i trùng với prefix của chuỗi. Cửa sổ [l,r] giúp dùng lại kết quả đã tính để đạt O(n).", "example": "“aaaa” có Z=[0,3,2,1], vì suffix bắt đầu ở 1 dài 3 giống prefix.", "code": "vector<int> z(n);int l=0,r=0;for(int i=1;i<n;i++){if(i<=r)z[i]=min(r-i+1,z[i-l]);while(i+z[i]<n&&s[z[i]]==s[i+z[i]])z[i]++;if(i+z[i]-1>r)l=i,r=i+z[i]-1;}", "complexity": "O(n).", "pitfalls": "Sai công thức z[i-l]; cập nhật r sai; nhầm với prefix function.", "check": "Tính tay Z của “abacaba”."}, "bao hàm-loại trừ": {"title": "Inclusion-Exclusion", "explain": "Đếm hợp bằng cộng singleton, trừ giao đôi, cộng giao ba... Dùng dấu (-1)^k. Phải xác định chính xác một phần tử được đếm bao nhiêu lần trước khi áp dụng.", "example": "1..10 chia hết cho 2 hoặc 3 = floor(10/2)+floor(10/3)-floor(10/6)=5+3-1=7.", "code": "ans=cnt2+cnt3-cntLCM23;", "complexity": "Nếu có k điều kiện và duyệt mọi subset thì O(2^k).", "pitfalls": "Quên giao bằng LCM; overflow LCM; nhầm “không thuộc” với “thuộc”.", "check": "Tính số <=N không chia hết cho 2,3,5 bằng PIE."}, "binary search": {"title": "Tìm trên miền đơn điệu", "explain": "Binary search giảm không gian tìm kiếm khoảng một nửa mỗi bước. Điều quan trọng là predicate phải đơn điệu: ví dụ false,false,false,true,true hoặc ngược lại.", "example": "Tìm x nhỏ nhất sao cho f(x)>=K; mỗi mid quyết định giữ nửa trái hay phải.", "code": "long long l=lo,r=hi,ans=hi;while(l<=r){long long m=l+(r-l)/2;if(ok(m)){ans=m;r=m-1;}else l=m+1;}", "complexity": "O(log range) lần gọi predicate. Tổng complexity = O(log range * cost(check)).", "pitfalls": "Predicate không đơn điệu; update l/r sai; overflow mid.", "check": "Viết và chứng minh invariant của phiên bản tìm first true."}, "bipartite": {"title": "Đồ thị hai phía", "explain": "Graph bipartite nếu đỉnh có thể tô 2 màu sao cho mọi cạnh nối hai màu khác nhau. BFS/DFS tô màu. Một cycle lẻ làm graph không bipartite và ngược lại.", "example": "1-2-3-1 là cycle lẻ -> NO; 1-2-3-4-1 -> có thể tô 0,1,0,1.", "code": "vector<int> color(n+1,-1);color[s]=0;queue<int>q;q.push(s);while(!q.empty()){int u=q.front();q.pop();for(int v:g[u])if(color[v]<0){color[v]=color[u]^1;q.push(v);}else if(color[v]==color[u])ok=false;}", "complexity": "O(n+m).", "pitfalls": "Chỉ kiểm tra component đầu; gặp self-loop phải kết luận NO.", "check": "Tự chứng minh equivalence giữa bipartite và không có cycle lẻ."}, "bridges": {"title": "Bridge và low-link", "explain": "Bridge là cạnh mà bỏ nó đi làm graph mất liên thông. Trong DFS vô hướng, cạnh tree u-v là bridge nếu low[v] > tin[u], nghĩa là subtree v không có cạnh ngược về u hoặc ancestor của u.", "example": "Graph path 1-2-3 có cả hai cạnh là bridge; thêm cạnh 1-3 thì không cạnh nào trong cycle là bridge.", "code": "tin[u]=low[u]=++timer;for(auto [v,id]:g[u]){if(id==parentId)continue;...if(low[v]>tin[u])bridge=true;}", "complexity": "O(n+m).", "pitfalls": "Đồ thị đa cạnh cần edge id; skip mọi cạnh tới parent vertex là sai.", "check": "Tạo graph có hai cạnh song song và kiểm tra bridge."}, "bài chưa từng thấy: tự tạo lời giải": {"title": "Từ bài lạ đến lời giải riêng", "explain": "Đây là kỹ năng không phụ thuộc tên thuật toán: giảm input, brute force, tìm pattern, viết conjecture, tìm counterexample, rồi chứng minh. Mục tiêu là tạo ra model mới thay vì nhớ editorial.", "example": "Với bài lạ, thử n<=6 và liệt kê đáp án; nếu thấy đáp án phụ thuộc vào sort order thì nghiên cứu tính chất đó.", "code": "// small cases -> brute -> observation -> conjecture -> counterexample -> proof -> algorithm", "complexity": "Không có complexity cố định; bắt đầu bằng brute nhỏ.", "pitfalls": "Ép bài vào template quen; bỏ qua phản ví dụ.", "check": "Tự giải một bài chưa từng làm trong 60-90 phút và ghi mọi observation thất bại."}, "centroid": {"title": "Centroid decomposition", "explain": "Centroid là đỉnh mà sau khi xóa nó, mọi component có kích thước <= n/2. Phân rã đệ quy theo centroid tạo cây centroid có độ sâu O(log n), rất hữu ích cho query khoảng cách trên cây.", "example": "Muốn query khoảng cách gần nhất tới một tập node đỏ: lưu thông tin tốt nhất theo từng centroid ancestor.", "code": "// find subtree sizes -> find centroid -> process -> mark removed -> recurse components", "complexity": "Mỗi node xuất hiện O(log n) tầng; tổng nhiều bài O(n log n) hoặc O(n log² n).", "pitfalls": "Tính subtree trên component cũ; không reset/đánh dấu centroid bị xóa.", "check": "Chứng minh vì sao recursion depth O(log n)."}, "chia để trị": {"title": "Divide and conquer", "explain": "Chia bài thành phần nhỏ, giải từng phần, rồi combine. Cần trả lời ba câu: chia thế nào, giải con ra sao, combine có tốn bao nhiêu.", "example": "Merge sort chia [l,r] đôi, sort hai nửa, merge O(n) -> T(n)=2T(n/2)+O(n).", "code": "void solve(int l,int r){if(l>=r)return;int m=(l+r)/2;solve(l,m);solve(m+1,r);mergePart(l,m,r);} ", "complexity": "Phải lập recurrence rồi giải; merge sort O(n log n).", "pitfalls": "Base case sai; combine quá đắt; chia không giảm kích thước.", "check": "Vẽ recursion tree và tính số phần tử ở mỗi tầng."}, "chứng minh": {"title": "Các mẫu proof trong thuật toán", "explain": "Proof có thể là invariant của loop, induction trên n, exchange argument cho greedy, cut property cho MST hoặc chứng minh DP không bỏ sót trạng thái. Chọn mẫu phù hợp với cấu trúc algorithm.", "example": "MST Kruskal: tại mỗi bước, cạnh nhẹ nhất nối hai component khác nhau có thể xuất hiện trong một MST bằng cut property.", "code": "// Theorem -> cases -> proof -> conclusion", "complexity": "Không có complexity riêng.", "pitfalls": "Chứng minh dựa trên kết quả cần chứng minh; quên điều kiện tiên đề.", "check": "Viết tên loại proof trước khi bắt đầu phần chứng minh."}, "code": {"title": "Kỷ luật viết code thi thuật toán", "explain": "Code tốt giữ separation giữa input, state, transition và output. Tên biến phải phản ánh vai trò. Template chỉ là công cụ; mọi dòng quan trọng phải giải thích được.", "example": "Trong DP, viết state comment trước mảng dp, rồi transition sau đó; giúp phát hiện nhầm chiều.", "code": "// state definition; initialization; transition; answer", "complexity": "Tôn trọng complexity đã dự tính.", "pitfalls": "Macro quá đà; magic number; trộn indexing 0/1.", "check": "Review code và đánh dấu mỗi dòng thuộc Problem/Model/Algorithm nào."}, "contest dưới áp lực": {"title": "Chiến thuật thi", "explain": "Quản lý thời gian là một constraint. Đọc hết đề trước, phân loại độ khó và subtask, lấy điểm chắc, gửi phiên bản đúng một phần nếu cần rồi tối ưu. Luôn chừa thời gian kiểm tra.", "example": "Contest 180 phút: 15-20 phút đọc đề, sau đó giải bài chắc điểm, cuối cùng dành thời gian stress/edge case.", "code": "// read all -> classify -> secure points -> optimize -> verify", "complexity": "Không cố định; mục tiêu là tối đa hóa điểm với thời gian hữu hạn.", "pitfalls": "Mắc kẹt quá lâu ở một bài; không submit bản đúng một phần; không test case biên.", "check": "Sau virtual contest, ghi timestamp của từng lần đổi bài."}, "debug": {"title": "Debug có phương pháp", "explain": "Debug bắt đầu bằng reproducer nhỏ nhất. Sau đó kiểm invariant, in state quan trọng, so sánh với brute/oracle và cố định counterexample. Random stress test đặc biệt hữu ích khi không biết WA nằm ở đâu.", "example": "Sinh ngẫu nhiên n<=8 rồi chạy solution và brute; nếu output khác, lưu input làm test cố định.", "code": "while(true){gen();runSol();runBrute();if(diff){save();break;}}", "complexity": "Chi phí phụ thuộc số test; brute chỉ dùng input nhỏ.", "pitfalls": "Sửa theo cảm giác; chỉ kiểm sample; không lưu test gây lỗi.", "check": "Mỗi bug phải có một test hồi quy để ngăn lỗi quay lại."}, "diameter": {"title": "Đường kính cây", "explain": "Diameter là khoảng cách lớn nhất giữa hai đỉnh. Với cây, BFS/DFS từ đỉnh bất kỳ tìm u xa nhất; từ u chạy lần nữa tìm v xa nhất và distance(u,v) là diameter.", "example": "Path 1-2-3-4-5 có diameter 4.", "code": "u=farthest(1); [v,diam]=farthest(u);cout<<diam;", "complexity": "O(n) trên cây.", "pitfalls": "Áp dụng mù quáng cho graph có cycle; quên tree được coi là unweighted/weighted tùy biến thể.", "check": "Tự chứng minh vì sao hai lần BFS hoạt động trên tree."}, "giải đề HSG cũ": {"title": "Luyện đề theo chuẩn thi", "explain": "Giải đề cũ không chỉ để biết đáp án mà để luyện phân bổ điểm, đọc constraint, nhận dạng subtask và viết lời giải đủ chặt. Sau mỗi đề phải post-mortem.", "example": "Sau một đề, ghi: bài nào ra nhanh, bài nào tắc, observation nào đáng giữ, bug nào lặp lại.", "code": "// Read -> classify -> solve -> submit -> post-mortem", "complexity": "Đề có thể yêu cầu nhiều complexity khác nhau; phải ghi riêng từng bài.", "pitfalls": "Xem editorial quá sớm; không làm lại bài đã xem lời giải.", "check": "Viết một trang tổng kết sau mỗi đề."}, "greedy": {"title": "Tham lam", "explain": "Greedy tối ưu từng bước nhưng chỉ đúng khi có property chứng minh được. Các proof phổ biến là exchange argument và cut property. Không có quy tắc “chọn lớn nhất” áp dụng cho mọi bài.", "example": "Activity selection: chọn interval có end sớm nhất giúp để lại nhiều thời gian nhất cho các interval sau.", "code": "sort(a.begin(),a.end(),[](auto x,auto y){return x.r<y.r;});", "complexity": "Thường O(n log n) nếu cần sort.", "pitfalls": "Thấy sample khớp rồi kết luận đúng; thiếu proof hoặc counterexample.", "check": "Cho một greedy, cố tìm counterexample n<=5 trước khi tin nó."}, "grid": {"title": "DFS/BFS trên lưới", "explain": "Xem ô là node và các bước đi là cạnh. Cần quyết định 4 hướng hay 8 hướng, ô nào bị chặn và có cần lưu khoảng cách/parent hay không. Nên kiểm boundary bằng helper.", "example": "Maze 5x5: BFS từ S tìm đường ngắn nhất tới T qua ô không phải #.", "code": "int dx[4]={1,-1,0,0},dy[4]={0,0,1,-1};for(int k=0;k<4;k++){nx=x+dx[k];ny=y+dy[k];if(inside&&grid[nx][ny]!='#')...}", "complexity": "O(rows*cols).", "pitfalls": "Out-of-bounds; 4/8 hướng; đánh dấu visited quá muộn.", "check": "Viết hàm inside(x,y) và dùng ở mọi nơi."}, "grid DP": {"title": "DP trên lưới", "explain": "State thường dp[i][j] là đáp án tới ô (i,j). Transition phụ thuộc các ô trước như dp[i-1][j], dp[i][j-1], có thể thêm tường hoặc cost. Thứ tự duyệt phải bảo đảm parent đã được tính.", "example": "Số đường từ (1,1) tới (n,m) tránh #; dp[i][j]=dp[i-1][j]+dp[i][j-1].", "code": "if(grid[i][j]=='#') dp[i][j]=0;else dp[i][j]=(dp[i-1][j]+dp[i][j-1])%MOD;", "complexity": "O(nm) time; memory O(nm) hoặc O(m) nếu nén được.", "pitfalls": "Sai base ở góc; đọc dp ngoài biên; quên modulo.", "check": "Tự tính bảng 3x3 có một ô chặn bằng tay."}, "hashing": {"title": "Hashing cho xâu", "explain": "Hash biến đoạn xâu thành giá trị giúp so sánh substring nhanh. Prefix hash + power cho phép lấy hash đoạn O(1). Vì collision có xác suất, có thể dùng double hash hoặc 64-bit.", "example": "So sánh s[l1,r1] với s[l2,r2] có cùng độ dài bằng hash đã chuẩn hóa.", "code": "H[i+1]=(H[i]*B+s[i])%M;hash(l,r)=H[r]-H[l]*powB[r-l];", "complexity": "Build O(n), query substring O(1).", "pitfalls": "Âm sau phép trừ; power sai; collision; modulus/base yếu.", "check": "Viết double hash và random-test collision assumptions."}, "heap": {"title": "Heap và invariant", "explain": "Heap chỉ đảm bảo parent ưu tiên hơn child; toàn bộ mảng không được sort. priority_queue là interface phổ biến. Heap thích hợp khi cần lấy min/max liên tục và update không biết trước thứ tự.", "example": "Giữ k phần tử nhỏ nhất bằng max-heap size k; nếu size>k thì pop phần tử lớn nhất trong k.", "code": "priority_queue<int> pq;for(int x:a){pq.push(x);if(pq.size()>k)pq.pop();}", "complexity": "push/pop O(log k), top O(1).", "pitfalls": "Duyệt pq và mong thấy thứ tự tăng; comparator sai.", "check": "Viết min-heap pair(distance,node) rồi giải thích top."}, "interval/tree/bitmask/digit DP": {"title": "Bốn mẫu DP nâng cao", "explain": "Interval DP dùng [l,r]; tree DP dùng node + trạng thái cha/con; bitmask DP dùng tập đã chọn; digit DP dùng vị trí chữ số, tight và các điều kiện phụ. Điểm khó nằm ở state chứ không phải syntax.", "example": "Matrix chain: dp[l][r] là chi phí gộp đoạn. Digit DP: đếm số <=N thỏa không có chữ số 4.", "code": "// interval: for(len=2;len<=n;len++)...; // bitmask: for(mask)...; // digit: dfs(pos,tight,state)", "complexity": "Interval thường O(n^3); bitmask O(n2^n); digit DP thường O(digits*states*base).", "pitfalls": "State thiếu thông tin; order sai; 2^n vượt giới hạn.", "check": "Trước khi code phải viết state bằng một câu hoàn chỉnh."}, "linked list": {"title": "Danh sách liên kết", "explain": "Mỗi node chứa dữ liệu và pointer tới node sau hoặc trước. Traversal O(n), chèn/xóa O(1) nếu đã có pointer đúng vị trí. Hiểu linked list giúp hiểu pointer nhưng trong contest vector thường có locality tốt hơn.", "example": "Xóa node sau cur trong singly linked list không cần dịch phần tử.", "code": "struct Node{int x;Node*next;};cur->next=cur->next->next;", "complexity": "Search/index O(n), insert/delete tại node biết trước O(1).", "pitfalls": "nullptr dereference, dangling pointer, memory leak.", "check": "Vẽ pointer trước và sau một thao tác delete."}, "ma trận mũ": {"title": "Lũy thừa ma trận", "explain": "Đưa recurrence tuyến tính về vector trạng thái và ma trận chuyển. Binary exponentiation của ma trận giảm số phép nhân từ O(n) xuống O(log n) lần nhân ma trận.", "example": "Fibonacci: [[1,1],[1,0]]^(n-1) biến [F1,F0] thành [Fn,F(n-1)].", "code": "// multiply(A,B); power(A,n); dùng modulo ở từng phép cộng/nhân", "complexity": "O(k^3 log n) cho ma trận kxk nhân ngây thơ.", "pitfalls": "Exponent lệch một; matrix dimension sai; overflow trước modulo.", "check": "Tự dựng ma trận cho f(n)=3f(n-1)+2f(n-2)."}, "matching": {"title": "Bipartite matching", "explain": "Matching là tập cạnh không chung endpoint. Kuhn tìm augmenting path bằng DFS; Hopcroft-Karp tăng tốc bằng BFS theo lớp + DFS. Điều quan trọng là khi tìm augmenting path phải cho phép reassignment.", "example": "3 người và 3 việc, cạnh thể hiện khả năng làm việc; tìm số ghép tối đa.", "code": "// match[v]=u; dfs(u) tries each v and recursively rematches match[v]", "complexity": "Kuhn O(VE); Hopcroft-Karp O(E sqrt V).", "pitfalls": "seen không reset cho mỗi lượt; rematch sai.", "check": "Tự tìm một augmenting path có độ dài 3."}, "max flow": {"title": "Maximum flow", "explain": "Mỗi cạnh có capacity. Flow phải không âm, không vượt capacity và bảo toàn tại node trung gian. Residual graph cho phép hoàn tác flow cũ. Dinic dùng BFS level graph rồi DFS blocking flow.", "example": "s->a 3, a->t 2, s->t 1 có max flow 3.", "code": "// addEdge(u,v,cap): add forward and reverse cap=0; bfs level; dfs send flow", "complexity": "Bound của Dinic phụ thuộc graph; triển khai thực tế thường dùng rất tốt cho cỡ vừa/lớn.", "pitfalls": "Quên reverse edge; cập nhật capacity sai; recursion sâu.", "check": "Vẽ residual graph sau một augment 1 đơn vị."}, "meet-in-the-middle": {"title": "Chia đôi không gian 2^n", "explain": "n khoảng 40 quá lớn cho 2^n nhưng 2^(n/2) có thể làm. Chia input thành hai nửa, sinh mọi trạng thái mỗi nửa rồi ghép.", "example": "Subset sum <=K: sort sums phải; với mỗi sum trái tìm sum phải lớn nhất <=K-left.", "code": "left=gen(0,mid);right=gen(mid,n);sort(right.begin(),right.end());", "complexity": "O(2^(n/2) log 2^(n/2)) thường thấy.", "pitfalls": "2^(n/2) memory quá lớn; ghép sai inequality.", "check": "Tính số trạng thái khi n=36,40 và memory cần nếu long long."}, "min-cost flow": {"title": "Min-cost max-flow", "explain": "Ngoài capacity, mỗi edge có cost. Mỗi augmenting path cần vừa khả dụng về capacity vừa tối ưu cost. Residual reverse edge có cost âm. Potentials cho phép dùng Dijkstra khi reduced cost không âm.", "example": "Ghép người-công việc với cost khác nhau và cần k assignments có tổng cost nhỏ nhất.", "code": "// shortest path on residual; augment bottleneck; update potentials", "complexity": "Successive shortest path thường O(F E log V) với potentials trong điều kiện phù hợp.", "pitfalls": "Dùng Dijkstra trực tiếp khi còn negative reduced cost; quên reverse cost=-cost.", "check": "Giải thích ý nghĩa của reverse edge cost."}, "monotonic queue": {"title": "Deque đơn điệu", "explain": "Deque giữ các index ứng viên cho min/max cửa sổ. Khi thêm i, loại từ cuối các phần tử chắc chắn kém hơn a[i]; khi i-k ra khỏi cửa sổ, loại đầu.", "example": "Window max k=3 trên [1,3,2,5,4]: queue giữ index của các giá trị giảm dần.", "code": "deque<int>dq;while(!dq.empty()&&a[dq.back()]<=a[i])dq.pop_back();dq.push_back(i);if(dq.front()<=i-k)dq.pop_front();", "complexity": "O(n) amortized.", "pitfalls": "Lưu value thay index; xóa ngoài cửa sổ sai thời điểm.", "check": "Tự mô phỏng deque sau từng i trên [1,3,2,5]."}, "pair": {"title": "Pair", "explain": "pair là tuple 2 phần tử. So sánh mặc định theo first rồi second. Cực hữu ích để đóng gói state nhỏ, đặc biệt priority_queue và edge list.", "example": "Dijkstra lưu {distance,vertex}; sort pair mặc định sẽ ưu tiên distance nhỏ.", "code": "pair<long long,int> state={5,3};priority_queue<decltype(state),vector<decltype(state)>,greater<decltype(state)>>pq;", "complexity": "Truy cập first/second O(1).", "pitfalls": "Nhầm comparator; đổi thứ tự field làm logic khác.", "check": "Tạo pair<int,int> sort theo second tăng, first giảm."}, "parallel BS": {"title": "Parallel binary search", "explain": "Nhiều query đều tìm thời điểm/ngưỡng đơn điệu. Thay vì binary search từng query và chạy cấu trúc dữ liệu lại từ đầu, gom các query có cùng mid và xử lý các mid theo batch.", "example": "Mỗi query hỏi update thứ mấy thì giá trị vị trí i đạt K; process updates tăng dần và trả lời hàng loạt query.", "code": "// bucket queries by mid; process updates once; answer all queries at mid; shrink lo/hi", "complexity": "Thường thêm một hệ số log V so với một lượt process.", "pitfalls": "Không reset DS giữa vòng; thứ tự update sai; predicate không đơn điệu.", "check": "Viết predicate f(t)=\"đã đạt K\" và chứng minh nó đơn điệu."}, "persistent ST": {"title": "Segment tree persistent", "explain": "Mỗi version của segment tree có root riêng. Khi point-update, chỉ tạo các node trên đường từ root tới lá, phần còn lại dùng chung node cũ. Vì vậy version cũ vẫn truy cập được.", "example": "Version 0 là mảng ban đầu; update index 3 tạo version 1 nhưng query version0 vẫn cho dữ liệu cũ.", "code": "int update(int old,int l,int r,int pos,int val){int cur=clone(old);if(l==r){tree[cur]=val;return cur;}...return cur;}", "complexity": "O(log n) node mới mỗi update; memory O(n + q log n).", "pitfalls": "Không clone node; pool không đủ; liên kết child của version mới sai.", "check": "Đếm số node mới sau 3 update."}, "phân tích thừa số": {"title": "Prime factorization", "explain": "Tách n thành tích các prime powers. Chia thử tới sqrt(n); nếu p chia hết thì lấy hết số mũ e. Sau cùng n>1 nghĩa là còn một prime lớn hơn sqrt của phần đã giảm.", "example": "60=2^2*3*5; từ đó số ước = (2+1)(1+1)(1+1)=12.", "code": "for(long long p=2;p*p<=n;p++)if(n%p==0){int e=0;while(n%p==0)n/=p,e++;fac.push_back({p,e});}if(n>1)fac.push_back({n,1});", "complexity": "O(sqrt n) cho một n.", "pitfalls": "Quên phần còn lại; p*p overflow; thử tới n làm quá chậm.", "check": "Từ factorization của 360 suy ra số ước và tổng ước."}, "prefix sum": {"title": "Prefix sum 1D/2D", "explain": "Prefix sum đổi nhiều range sum thành O(1). 1D: pref[i]=a[1]+...+a[i]. 2D: P[i][j]=sum rectangle (1,1)-(i,j) bằng inclusion-exclusion.", "example": "a=1,2,3,4,5 → sum[2,4]=pref[4]-pref[1]=9. Với ma trận, dùng 4 prefix corners.", "code": "pref[i]=pref[i-1]+a[i];sum=pref[r]-pref[l-1];", "complexity": "Build O(n), query O(1); 2D build O(nm), rectangle O(1).", "pitfalls": "Lệch index; int overflow; 2D inclusion-exclusion sai dấu.", "check": "Tự tính một rectangle query 2D bằng tay."}, "primitive root": {"title": "Căn nguyên thủy", "explain": "g là primitive root mod prime p nếu order(g)=p-1. Chỉ cần kiểm tra g^((p-1)/q) !=1 cho mọi prime q phân biệt chia p-1.", "example": "Modulo 7, g=3 sinh các phần tử khác 0 trước khi lặp lại 1.", "code": "for(q:primeFactors(p-1))if(modpow(g,(p-1)/q,p)==1)bad=true;", "complexity": "Tìm g nhỏ nhất cần factor p-1 và thử ứng viên.", "pitfalls": "Không factor p-1 đúng; chỉ thử một q; modulus không prime.", "check": "Tự kiểm tra 3 có primitive root modulo 7 không."}, "sinh hoán vị/tổ hợp": {"title": "Sinh cấu hình", "explain": "Permutation quan tâm thứ tự; combination không quan tâm thứ tự. next_permutation tiện cho permutation, DFS với start cho combination. Trùng phần tử cần xử lý để tránh duplicate.", "example": "Từ {1,2,3}: 6 permutation nhưng 3 combination size2.", "code": "sort(a.begin(),a.end());do{...}while(next_permutation(a.begin(),a.end()));;void comb(int start){if(cur.size()==k){...;return;}for(int i=start;i<n;i++){cur.push_back(a[i]);comb(i+1);cur.pop_back();}}", "complexity": "Permutation O(n*n!), combination O(k*C(n,k)) khi tính cả output.", "pitfalls": "Quên sort initial; duplicate; combination cho phép quay lại index khi không được phép.", "check": "Tự sinh C(5,2) và đếm đúng 10 cấu hình."}, "sliding window": {"title": "Cửa sổ trượt", "explain": "Duy trì một đoạn liên tiếp [l,r]. Mở rộng r; khi invariant bị phá thì tăng l. Độ đúng đến từ việc mỗi phần tử chỉ được thêm/bớt hữu hạn lần. Với số âm, điều kiện tổng thường không còn monotone.", "example": "Dãy không âm, tìm đoạn dài nhất có tổng <=K bằng while(sum>K) sum-=a[l++].", "code": "long long sum=0;int l=0;for(int r=0;r<n;r++){sum+=a[r];while(sum>K)sum-=a[l++];ans=max(ans,r-l+1);} ", "complexity": "O(n) khi add/remove O(1).", "pitfalls": "Dùng công thức cho input có số âm; l chạy qua r; quên cập nhật state.", "check": "Nêu invariant của cửa sổ và chỉ ra trường hợp nó không đúng."}, "sparse table": {"title": "Range query tĩnh", "explain": "Precompute answer trên mọi đoạn độ dài 2^k. Với phép idempotent như min/max/gcd, hai block chồng nhau vẫn cho cùng kết quả nên query O(1). Không hỗ trợ update nhanh.", "example": "RMQ min [l,r] dùng k=floor(log2(len)), lấy min(st[k][l],st[k][r-2^k+1]).", "code": "st[0][i]=a[i];for(int k=1;k<LOG;k++)for(int i=0;i+(1<<k)<=n;i++)st[k][i]=min(st[k-1][i],st[k-1][i+(1<<(k-1))]);", "complexity": "Build O(n log n), query O(1), memory O(n log n).", "pitfalls": "Dùng sparse table chồng block cho sum; sai range endpoint.", "check": "Liệt kê phép toán nào idempotent và phép nào không."}, "sqrt decomposition": {"title": "Chia block căn bậc hai", "explain": "Chia array thành block khoảng sqrt(n), lưu aggregate cho từng block. Query xử lý phần tử ở hai mép và block đầy đủ ở giữa. Đơn giản hơn segment tree nhưng chậm hơn asymptotic.", "example": "Range sum: blockSum[b] lưu tổng block, query đọc blockSum cho phần giữa.", "code": "int B=sqrt(n)+1;vector<long long> bs(B);", "complexity": "Khoảng O(sqrt n) mỗi query/update tùy bài.", "pitfalls": "Sai block index; block size chọn tùy n nhưng không cần tuyệt đối chính xác.", "check": "Tự chia n=16 thành block size 4 và viết các index thuộc từng block."}, "stars & bars": {"title": "Stars and Bars", "explain": "Đếm nghiệm x1+...+xk=n. Với xi>=0 có C(n+k-1,k-1). Với xi>=1 đặt yi=xi-1 rồi áp dụng công thức không âm.", "example": "5 viên bi giống nhau vào 3 hộp cho phép rỗng -> C(7,2)=21.", "code": "// nonnegative: C(n+k-1,k-1); positive: C(n-1,k-1)", "complexity": "Phụ thuộc cách tính C và modulus.", "pitfalls": "Nhầm vật giống nhau với khác nhau; dùng C(n,k) sai chỉ số.", "check": "Tự vẽ 5 ngôi sao và 2 vạch chia cho trường hợp 3 hộp."}, "state/transition": {"title": "Thiết kế state DP", "explain": "State phải chứa đúng thông tin cần để quyết định phần còn lại. Transition mô tả cách thêm một quyết định. Base case là trạng thái nhỏ nhất; order phải bảo đảm dependency đã có.", "example": "Knapsack: state dp[w] sau khi xét các item đã duyệt; transition chọn/bỏ item. Coin change: state chỉ phụ thuộc tổng hiện tại.", "code": "// write: dp[...] means ...; dp[base]=...; dp[new]=merge(dp[old],choice)", "complexity": "Không có một complexity cố định; phụ thuộc số state*transition.", "pitfalls": "State thừa làm chậm; state thiếu làm sai; transition đếm một solution nhiều lần.", "check": "Viết state bằng một câu bắt đầu bằng “dp[...] là ...”."}, "subtree size": {"title": "Kích thước cây con", "explain": "Root cây tại một đỉnh. subtree[u] bằng 1 cộng tổng subtree của các con. DFS postorder đảm bảo mọi con đã có size trước khi tính cha.", "example": "Nếu u có 3 con size 2,4,1 thì subtree[u]=8.", "code": "void dfs(int u,int p){sub[u]=1;for(int v:g[u])if(v!=p){dfs(v,u);sub[u]+=sub[v];}}", "complexity": "O(n).", "pitfalls": "Không bỏ parent trong graph vô hướng; root sai; dùng size cũ sau nhiều query.", "check": "Tự tính subtree size cho cây 7 đỉnh."}, "suffix array": {"title": "Sắp xếp tất cả suffix", "explain": "Suffix array lưu thứ tự chỉ số bắt đầu của mọi suffix theo từ điển. Nó hỗ trợ tìm occurrence, substring order, LCP và nhiều bài string nâng cao.", "example": "banana có suffix bắt đầu ở các vị trí được sắp theo thứ tự từ điển; không cần tạo chuỗi mới cho mỗi suffix.", "code": "// doubling: rank[i]; sort by (rank[i],rank[i+len]); update rank; len*=2", "complexity": "Doubling đơn giản thường O(n log^2 n); có biến thể O(n log n).", "pitfalls": "Rank pair sai; sentinel; index out of range.", "check": "Liệt kê 3 suffix của “aba” và sort tay."}, "template cá nhân": {"title": "Template để tăng tốc code, không thay thế hiểu biết", "explain": "Template nên chứa những module bạn đã tự test: fast I/O, gcd, modpow, DSU, Fenwick, Dijkstra... Có thể comment complexity ngay bên cạnh để tránh dùng sai.", "example": "Một template Dijkstra có struct Edge, priority_queue min-heap và dist long long; trước contest chỉ cần thay input.", "code": "// section: types; helpers; data structures; main", "complexity": "Không có complexity riêng; mỗi module phải ghi bound của nó.", "pitfalls": "Template có bug nhưng dùng ở mọi bài; macro gây khó debug; code thừa.", "check": "Tự xóa mọi dòng không hiểu khỏi template rồi test lại."}, "thành phần liên thông": {"title": "Connected components", "explain": "Trong graph vô hướng, component là tập đỉnh nối được với nhau. DFS/BFS từ mọi đỉnh chưa thăm đếm component. Có thể lưu size để tìm component lớn nhất.", "example": "Cạnh 1-2,3-4 trên 5 đỉnh tạo 3 component.", "code": "int cc=0;for(int s=1;s<=n;s++)if(!vis[s]){cc++;dfs(s);} ", "complexity": "O(n+m).", "pitfalls": "Chỉ DFS từ 1; không reset visited; nhầm số component với n-m.", "check": "Tự thêm một đỉnh cô lập và xem answer thay đổi thế nào."}, "topo sort": {"title": "Topological sort", "explain": "Topo order đặt mọi u trước v với cạnh u->v. Kahn dùng indegree: đẩy các node indegree 0 vào queue rồi loại cạnh. Nếu số node lấy ra <n thì có cycle.", "example": "1->2,1->3,2->4,3->4 có nhiều topo hợp lệ.", "code": "queue<int>q;for(int i=1;i<=n;i++)if(indeg[i]==0)q.push(i);while(!q.empty()){int u=q.front();q.pop();ord.push_back(u);for(int v:g[u])if(--indeg[v]==0)q.push(v);} ", "complexity": "O(n+m).", "pitfalls": "Không kiểm tra ord.size; tưởng chỉ có một topo; quên graph phải có hướng.", "check": "Sửa Kahn để lấy topo nhỏ nhất từ điển."}, "trie": {"title": "Cây tiền tố", "explain": "Mỗi cạnh là một ký tự; node biểu diễn prefix. insert đi theo từng char, query prefix cũng đi từng char. Lưu pass/end nếu cần đếm số từ.", "example": "Insert cat, car, dog; prefix ca có 2 từ.", "code": "struct Node{int nxt[26];int pass,end;};// insert: u=next[u][c], pass++; end++", "complexity": "O(length) mỗi insert/query; memory phụ thuộc tổng số ký tự.", "pitfalls": "Không khởi tạo next; alphabet không phải a-z; memory blow-up.", "check": "Viết query đếm số từ bắt đầu bằng “ca”."}, "two pointers": {"title": "Hai con trỏ", "explain": "Hai chỉ số cùng di chuyển theo
