function formatCodeSample(src){
  let s=String(src??'');
  s=s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<p[^>]*>/gi,'');
  s=s.replace(/&nbsp;/g,' ');
  if(/^`[\s\S]*`$/.test(s.trim())) s=s.trim().slice(1,-1);
  s=s.replace(/\r\n?/g,'\n');
  const out=[]; let line=''; let indent=0; let paren=0, bracket=0; let inString=false, inChar=false, escape=false; let lineComment=false;
  const push=()=>{const x=line.trim(); if(x) out.push('  '.repeat(Math.max(0,indent))+x); line='';};
  const isBlockBrace=(before)=>{
    const t=before.trim();
    if(!t) return true;
    if(/[=,:]\s*$/.test(t)) return false;
    if(/\b(struct|class|enum|namespace|union)\b[^;]*$/.test(t)) return true;
    return /\)\s*$|\b(else|try|do)\s*$/.test(t);
  };
  for(let i=0;i<s.length;i++){
    const ch=s[i], nx=s[i+1]||'';
    if(lineComment){
      if(ch==='\n'){push();lineComment=false;}else line+=ch;
      continue;
    }
    if(inString||inChar){
      line+=ch;
      if(escape){escape=false;continue;}
      if(ch==='\\'){escape=true;continue;}
      if(inString && ch==='"') inString=false;
      if(inChar && ch==="'") inChar=false;
      continue;
    }
    if(ch==='/'&&nx==='/'){line+=ch+nx;i++;lineComment=true;continue;}
    if(ch==='"'){inString=true;line+=ch;continue;}
    if(ch==="'"){inChar=true;line+=ch;continue;}
    if(ch==='('){paren++;line+=ch;continue;}
    if(ch===')'){paren=Math.max(0,paren-1);line+=ch;continue;}
    if(ch==='['){bracket++;line+=ch;continue;}
    if(ch===']'){bracket=Math.max(0,bracket-1);line+=ch;continue;}
    if(ch==='{'){
      const block=isBlockBrace(line);
      line+=ch;
      if(block){push();indent++;}
      continue;
    }
    if(ch==='}'){
      if(line.trim()) push();
      indent=Math.max(0,indent-1);
      line='}';
      const rest=s.slice(i+1);
      const m=rest.match(/^\s*([;,)]?)/); const after=m?.[1]||'';
      if(!after) push();
      continue;
    }
    if(ch===';' && paren===0 && bracket===0){line+=ch;push();continue;}
    if(ch==='\n'){push();continue;}
    line+=ch;
  }
  if(line.trim()) push();
  return out.join('\n').replace(/^([ \t]+)}(?=;)/gm,'$1}');
}

function richTopic(t){
  const k=TOPIC_MORE[t]||TOPIC_DETAIL[t];
  if(!k) return `<details class="mini lesson"><summary>📘 <b>${t}</b></summary><div class="bd lesson-body"><p>Kiến thức này chưa có tài liệu riêng trong dữ liệu hiện tại.</p></div></details>`;
  const full=Array.isArray(k)?{
    title:k[0],
    explain:`${k[0]} là kiến thức cốt lõi của level này. ${k[2]}`,
    example:`Lấy đoạn code mẫu dưới đây làm ví dụ đầu tiên. Tự thay input, dự đoán output rồi mới chạy chương trình.`,
    code:k[1],
    complexity:'Phân tích độ phức tạp của thuật toán thật sự, không chỉ đếm số dòng code.',
    pitfalls:k[2],
    check:`Tự viết lại ${t} từ đầu, đổi ít nhất 2 test và giải thích từng dòng quan trọng.`
  }:k;
  return `<details class="mini lesson"><summary>📘 <b>${t}</b></summary><div class="bd lesson-body">
    <div class="lesson-grid">
      <section><h4>1. Khái niệm</h4><p>${full.explain}</p></section>
      <section><h4>2. Ví dụ cụ thể</h4><p>${full.example}</p></section>
    </div>
    <section><h4>3. Code mẫu / pseudocode</h4><pre>${esc(formatCodeSample(full.code))}</pre></section>
    <div class="lesson-grid">
      <section><h4>4. Độ phức tạp</h4><p>${full.complexity}</p></section>
      <section><h4>5. Lỗi thường gặp</h4><p>${full.pitfalls}</p></section>
    </div>
    <section class="lesson-check"><h4>6. Tự kiểm tra</h4><p>${full.check}</p></section>
  </div></details>`;
}

  return {title:t,explain:`${t} là một kỹ năng trong level ${level}. Mục tiêu của bài học là hiểu định nghĩa, điều kiện áp dụng và mô hình hóa bài toán trước khi viết code.`,example:`Hãy tạo một ví dụ nhỏ có ít dữ liệu, dự đoán output và mô phỏng thuật toán từng bước.`,code:`// ${t}\n// 1) xác định input\n// 2) xác định trạng thái / invariant\n// 3) áp dụng thao tác chính\n// 4) kiểm tra điều kiện dừng`,complexity:'Không có một bound cố định cho mọi bài; complexity phụ thuộc cách triển khai cụ thể.',pitfalls:'Không kiểm tra constraint, giả định điều kiện không tồn tại hoặc áp dụng thuật toán ngoài miền phù hợp.',check:`Viết 3 câu: kiến thức này giải quyết vấn đề gì, khi nào dùng, và constraint nào khiến nó phù hợp.`};

function graphTopicNodes(){
  const names=[];
  for(let i=0;i<L.length;i++) for(const t of L[i][2].split(', ')){if(!names.some(x=>x.t===t))names.push({t,levels:[i]});else names.find(x=>x.t===t).levels.push(i)}

function gradeQuiz(level,t){
  const k=phase2TopicKey(level,t), form=document.getElementById('quiz_'+topicDomId(level,t));if(!form)return;
  const qs=quizInfo(level,t), chosen=[...form.querySelectorAll('input[type=radio]:checked')];
  if(chosen.length!==qs.length){S.quizMsg[k]={kind:'bad',text:'⚠️ Hãy trả lời đủ tất cả câu hỏi trước khi chấm.'};S.openLessonKey=k;R();return;}
  let score=0;const wrong=[];
  qs.forEach((q,qi)=>{const v=form.querySelector(`input[name="q_${topicHash(k)}_${qi}"]:checked`)?.value;if(Number(v)===q.c)score++;else wrong.push(qi+1)});
  const prev=S.quiz[k]?.best||0;const newBest=score>prev;S.quiz[k]={...(S.quiz[k]||{}),best:Math.max(prev,score),total:qs.length,attempts:(S.quiz[k]?.attempts||0)+1,last:new Date().toISOString()};
  const mastery=Math.max(masteryOf(level,t),Math.round((score/qs.length)*80)+(S.mastery[k]>=20?20:0));S.mastery[k]=Math.min(100,mastery);
  S.quizMsg[k]={kind:score===qs.length?'good':'bad',text:`${score}/${qs.length} đúng · Mastery ${S.mastery[k]}%${wrong.length?` · Sai câu ${wrong.join(', ')}`:''}`};
  if(wrong.length)recordMistake('quiz',`${L[level][0]} · ${t}`,`Quiz ${score}/${qs.length}. Câu sai: ${wrong.join(', ')}.`,phase2TopicKey(level,t));if(newBest){S.rpg.stats.quizzes=(S.rpg.stats.quizzes||0)+1;rpgEvent('quiz',{topic:k,score,total:qs.length});}
  S.openLessonKey=k;S.lastTopic=k;sv();checkAchievements();syncPhase2Cloud();R();
}

async function contestsView(){await refreshContestCatalog();const cats=contestCatalogCache?.length?contestCatalogCache:CONTEST_CATALOG;if(!contestSessionOpen()){return `${ratingHistoryHint()}<div class="contestHero"><div class="contestTitle">🏆 Contest Arena</div><small>Thi dưới áp lực thời gian. AC = điểm; mỗi WA trước AC cộng penalty. Virtual cho phép luyện lại contest mà không thay đổi rating server.</small></div><div class="contestGrid">${cats.map(contestCardHtml).join('')}</div><div class="panel"><h3>📊 Rating</h3><small>Rating chỉ thay đổi sau contest rated khi bạn đăng nhập. Guest/Local Virtual không ảnh hưởng BXH rating.</small></div>`;}
const c=contestById(S.contest.activeId),remaining=S.contest.finished?0:contestRemaining(c),localMode=!cloudUser||S.contest.mode==='local';const st=localMode?contestLocalStats(c.id):null;if(cloudUser&&!localMode)await loadContestStandings();const solved=localMode?st.solved:new Map((window.phase5Standings||[]).filter(x=>x.user_id===cloudUser?.id).map(x=>[Number(x.problem_id),x]));return `<div class="contestHero"><div class="contestTop"><div><div class="contestTitle">${c.title}</div><small>${esc(c.description||'')}</small><div class="contestMeta"><span class="contestPill">${S.contest.mode==='virtual'||localMode?'🎯 Virtual':'🔥 Live'}</span><span class="contestPill">${c.rated?'🏅 Rated':'Practice'}</span><span class="contestPill">🧩 ${contestProblemIds(c).length} bài</span></div></div><div id="contestTimer" class="contestTimer ${remaining>0&&!S.contest.finished?'live':'done'}">${contestTimeText(remaining)}</div></div><div class="contestToolbar">${S.contest.finished?`<button class="pri" onclick="S.contest.activeId=null;S.contest.result=null;sv();R()">← Danh sách contest</button>`:`<button class="pri" onclick="contestFinish()">🏁 Nộp contest / Kết thúc</button>`}<button onclick="loadContestStandings().then(R)">↻ Refresh BXH</button>${S.contest.finished?'':`<button onclick="leaveContest()">← Rời contest</button>`}</div></div><div class="panel"><div class="contestScore">${localMode?st.score:((window.phase5Standings||[]).find(x=>x.user_id===cloudUser?.id)?.score||0)} điểm</div><small>${localMode?`${st.solved.size}/${contestProblemIds(c).length} bài AC · penalty ${st.penalty}`:'Server scoreboard sẽ cập nhật sau mỗi submission.'}</small></div><div class="contestProblems">${contestProblems(c).map((p,i)=>{const q=contestProblemStatus(c.id,p.id);return `<div class="contestProblem ${q.solved?'solved':''}"><div class="letter">${String.fromCharCode(65+i)}</div><div class="cpMeta"><b>${esc(p[2])}</b><small>LV${p[0]} · ${D[p[1]][0]} · ${q.solved?'✅ AC':'Chưa AC'} · ${q.wrong} WA</small></div><div class="contestPenalty">${q.solved&&q.ac?`${Math.floor(Number(q.ac.contest_elapsed_seconds||0)/60)+q.wrong*c.penalty}m`:''}<br>${S.contest.finished?'🔒 Kết thúc':`<button onclick="contestOpenProblem(${p.id})">Mở</button>`}</div></div>`}).join('')}</div>${S.contest.result?`<div class="ratingHero"><div><small>KẾT QUẢ</small><div class="ratingNum">${Number(S.contest.result.score)||0}</div><small>${Number(S.contest.result.solved)||0} bài · penalty ${Number(S.contest.result.penalty)||0}</small></div><div>${S.contest.result.rating_after!=null?`<b>🏅 Rating ${Number(S.contest.result.rating_after)}</b>`:'<b>Virtual</b>'}</div></div>`:''}${contestStandingsHtml(localMode)}`;}
function contestRatingNotice(){return cloudUser?`<div class="note">🏅 Rating hiện tại: <b>${Number(S.rating||1000)}</b>. Contest rated sẽ cập nhật rating sau khi server finalize.</div>`:'<div class="note">👤 Guest: vẫn chơi Virtual được, nhưng không có rating server.</div>';}

function rpgDefault(){return {gold:0,streak:0,longestStreak:0,lastActiveDate:null,shield:0,skillPoints:0,skills:{},titles:['Rookie Coder'],equippedTitle:'Rookie Coder',inventory:{'wood-sword':1},quests:{},daily:{date:null,claimed:{},seen:{}},activity:{},events:[],stats:{contestsFinished:0,hsgChecks:0,solves:0,studies:0,quizzes:0}};}
function normalizeRpg(x){const d=rpgDefault(),o=x&&typeof x==='object'?x:{},out={...d,...o};out.skills={...d.skills,...(o.skills||{})};out.titles=Array.isArray(o.titles)&&o.titles.length?Array.from(new Set(o.titles)):d.titles;out.inventory={...d.inventory,...(o.inventory||{})};out.quests={...d.quests,...(o.quests||{})};out.daily={...d.daily,...(o.daily||{})};out.activity={...d.activity,...(o.activity||{})};out.events=Array.isArray(o.events)?o.events.slice(0,60):[];out.stats={...d.stats,...(o.stats||{})};return out;}
function rpgToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(new Date())}
function rpgYesterday(d){const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-1);return x.toISOString().slice(0,10)}
function rpgSkill(id){return Math.max(0,Math.min(5,Number(S.rpg?.skills?.[id]||0)))}
function rpgStudiedCount(){return Object.values(S.mastery||{}).filter(v=>Number(v)>=20).length}
function rpgResolvedMistakes(){return (S.mistakes||[]).filter(x=>x.resolved).length}
function rpgEnsureDay(){S.rpg=normalizeRpg(S.rpg);const d=rpgToday();if(S.rpg.daily.date!==d)S.rpg.daily={date:d,claimed:{},seen:{}}}
function rpgTouchStreak(){rpgEnsureDay();const d=rpgToday();if(S.rpg.lastActiveDate===d)return;if(S.rpg.lastActiveDate===rpgYesterday(d))S.rpg.streak=(Number(S.rpg.streak)||0)+1;else S.rpg.streak=1;S.rpg.longestStreak=Math.max(Number(S.rpg.longestStreak)||0,Number(S.rpg.streak)||0);S.rpg.lastActiveDate=d;if(rpgSkill('streak')>=1)S.rpg.shield=Math.min(2,Number(S.rpg.shield)||0)}
function rpgDailyMissions(){rpgEnsureDay();const seed=Number(rpgToday().replace(/-/g,''));const pool=[{id:'solve',icon:'⚔️',label:'AC ít nhất 1 bài',type:'solve',target:1,reward:35},{id:'study',icon:'📚',label:'Học 2 topic',type:'study',target:2,reward:30},{id:'quiz',icon:'🧠',label:'Hoàn thành 1 Quiz',type:'quiz',target:1,reward:30},{id:'debug',icon:'🧯',label:'Xử lý 1 lỗi',type:'debug',target:1,reward:25},{id:'hsg',icon:'👑',label:'Hoàn thành 2 checklist HSG',type:'hsg',target:2,reward:35},{id:'contest',icon:'🏆',label:'Hoàn thành 1 contest',type:'contest',target:1,reward:45}];const start=seed%pool.length;return [0,1,2].map(i=>pool[(start+i*2)%pool.length])}
function rpgProgress(type){rpgEnsureDay();return Number(S.rpg.activity[rpgToday()]?.[type]||0)}
function rpgEvent(type,meta={}){S.rpg=normalizeRpg(S.rpg);rpgEnsureDay();rpgTouchStreak();const d=rpgToday();S.rpg.activity[d]=S.rpg.activity[d]||{};S.rpg.activity[d][type]=Number(S.rpg.activity[d][type]||0)+1;const skillMap={study:'scholar',quiz:'scholar',solve:'warrior',debug:'debugger',daily:'focus'},base={study:5,quiz:7,solve:8,debug:5,hsg:6,contest:15,daily:0}[type]||0,bonus=rpgSkill(skillMap[type]||'focus'),gold=Math.floor(base+bonus);if(gold>0)S.rpg.gold=Math.min(999999,Number(S.rpg.gold||0)+gold);const label={study:'📚 Học topic',quiz:'🧠 Quiz',solve:'⚔️ AC bài',debug:'🧯 Xử lý lỗi',hsg:'👑 HSG',contest:'🏆 Contest',daily:'🎁 Daily reward'}[type]||'✨ Activity';S.rpg.events.unshift({at:new Date().toISOString(),type,label,meta,gold});S.rpg.events=S.rpg.events.slice(0,60);checkRpgQuests();sv();syncRpgCloud();return gold}
function checkRpgQuests(){for(const q of RPG_QUESTS){if(S.rpg.quests[q.id]?.claimed||!q.ok(S))continue;const g=q.reward.gold+Math.floor(q.reward.gold*0.1*Math.min(2,rpgSkill('architect')));S.rpg.gold+=g;S.rpg.skillPoints+=q.reward.sp;S.rpg.quests[q.id]={claimed:true,at:new Date().toISOString(),gold:g,sp:q.reward.sp};if(q.title&&!S.rpg.titles.includes(q.title))S.rpg.titles.push(q.title);ms=`🏅 Quest hoàn thành: ${q.name} · +${g} Gold · +${q.reward.sp} SP`}}
function claimDailyMission(id){rpgEnsureDay();const m=rpgDailyMissions().find(x=>x.id===id);if(!m)return;if(S.rpg.daily.claimed[id]){ms='⚠️ Nhiệm vụ này đã nhận thưởng hôm nay.';R();return}const prog=rpgProgress(m.type);if(prog<m.target){ms=`⚠️ Chưa đủ điều kiện: ${prog}/${m.target}.`;R();return}const g=m.reward+2*rpgSkill('focus');S.rpg.gold+=g;S.rpg.daily.claimed[id]={at:new Date().toISOString(),gold:g};rpgEvent('daily',{mission:id});ms=`🎁 Daily hoàn thành · +${g} Gold`;sv();syncRpgCloud();R()}
function buyRpgItem(id){const it=RPG_ITEMS.find(x=>x.id===id);if(!it)return;if(S.rpg.inventory[id]){ms='✅ Bạn đã sở hữu vật phẩm này.';R();return}if(S.rpg.gold<it.cost){ms='💰 Chưa đủ Gold.';R();return}S.rpg.gold-=it.cost;S.rpg.inventory[id]=1;ms=`🎒 Đã mua ${it.name}.`;sv();syncRpgCloud();R()}
function equipRpgTitle(title){if(S.rpg.titles.includes(title)){S.rpg.equippedTitle=title;sv();syncRpgCloud();R()}}
function buySkill(id){const k=RPG_SKILLS.find(x=>x.id===id),lv=rpgSkill(id);if(!k||lv>=k.max)return;const cost=k.cost[lv];if(Number(S.rpg.skillPoints||0)<cost){ms='✨ Chưa đủ Skill Points.';R();return}S.rpg.skillPoints-=cost;S.rpg.skills[id]=lv+1;if(id==='streak')S.rpg.shield=Math.max(1,Number(S.rpg.shield)||0);ms=`🌟 ${k.name} lên cấp ${lv+1}.`;sv();syncRpgCloud();R()}
function useShield(){if(Number(S.rpg.shield||0)<=0){ms='🔥 Không có streak shield.';R();return}const d=rpgToday();if(S.rpg.lastActiveDate===d){ms='✅ Hôm nay đã hoạt động rồi.';R();return}S.rpg.lastActiveDate=rpgYesterday(d);S.rpg.shield--;rpgTouchStreak();ms='🛡️ Streak shield đã cứu chuỗi.';sv();syncRpgCloud();R()}
function rpgQuestProgress(q){if(q.id==='first-ac')return Object.keys(S.done||{}).length;if(q.id==='study-10')return rpgStudiedCount();if(q.id==='debug-10')return rpgResolvedMistakes();if(q.id==='solve-25')return Object.keys(S.done||{}).length;if(q.id==='contest-1')return S.rpg.stats.contestsFinished;if(q.id==='hsg-1')return S.rpg.stats.hsgChecks;if(q.id==='master-10')return Object.values(S.mastery||{}).filter(v=>Number(v)>=80).length;if(q.id==='streak-7'||q.id==='streak-30')return S.rpg.longestStreak;return 0}
function rpgView(){rpgEnsureDay();const title=RPG_TITLES.find(x=>x.id===S.rpg.equippedTitle)||RPG_TITLES[0],missions=rpgDailyMissions();return `<div class="rpgHero"><div class="rpgTitle">${title.icon} ${esc(title.name)} · Full RPG</div><div class="rpgSub">${esc(title.desc)} · Lớp RPG độc lập với EXP và Rating.</div><div class="rpgHud"><div class="rpgHudCard"><small>💰 GOLD</small><b class="rpgGold">${Number(S.rpg.gold).toLocaleString('vi-VN')}</b></div><div class="rpgHudCard"><small>🔥 STREAK</small><b class="rpgStreak">${S.rpg.streak} ngày</b></div><div class="rpgHudCard"><small>🌟 SKILL POINTS</small><b>${S.rpg.skillPoints}</b></div><div class="rpgHudCard"><small>🏷️ TITLE</small><b>${S.rpg.titles.length}/${RPG_TITLES.length}</b></div></div></div><div class="rpgGrid"><div class="rpgCard"><h3>🎯 Daily Mission</h3><small>${rpgToday()} · reset 00:00 giờ Việt Nam</small>${missions.map(m=>{const p=rpgProgress(m.type),done=!!S.rpg.daily.claimed[m.id],pct=Math.min(100,Math.round(p/m.target*100));return `<div class="rpgMission ${done?'done':''}"><div class="rpgIcon">${m.icon}</div><div><b>${m.label}</b><div class="rpgTiny">${p}/${m.target} · +${m.reward}G</div><div class="rpgProgress"><i style="width:${pct}%"></i></div></div><button class="${!done&&p>=m.target?'pri rpgClaim':''}" ${done||p<m.target?'disabled':''} onclick="claimDailyMission('${m.id}')">${done?'✅ Đã nhận':p>=m.target?'Nhận':'Đang làm'}</button></div>`}).join('')}</div><div class="rpgCard"><h3>🔥 Streak</h3><p>Hoạt động có ý nghĩa mỗi ngày giữ chuỗi. Chỉ tăng 1 lần/ngày.</p><div class="rpgProgress"><i style="width:${Math.min(100,S.rpg.streak/30*100)}%"></i></div><p><b>${S.rpg.streak}</b> ngày hiện tại · kỷ lục <b>${S.rpg.longestStreak}</b></p>${S.rpg.shield?`<div class="rpgShield">🛡️ ${S.rpg.shield} shield</div>`:'<small>Mở skill Streak Keeper để có shield.</small>'}<div class="row"><button onclick="useShield()">🛡️ Dùng shield</button></div></div></div><div class="panel"><h3>📜 Quest Board</h3><div class="rpgGrid"> async function adminApi(action,payload={}){
  if(!supabaseClient||!cloudUser)throw new Error('Hãy đăng nhập trước.');
  const {data,error}=await supabaseClient.functions.invoke('admin-console',{body:{app_id:'tin_hoc_rpg',action,...payload}});
  if(error)throw new Error(data?.error||error.message||'Admin API lỗi.');
  if(data?.error)throw new Error(data.error);
  return data||{};
}
async function adminRefresh(){
  if(adminBusy)return;adminBusy=true;R();
  try{const [u,c,a]=await Promise.all([adminApi('users',{page:1,per_page:100}),adminApi('content-list'),adminApi('activity-list')]);adminUsers=u.users||[];adminContent=c.items||[];adminActivity=a.events||[];adminVerified=true;}
  catch(e){cloudMessage='⚠️ '+String(e.message||e);adminVerified=false;}
  finally{adminBusy=false;R();}
}
async function adminBootstrap(){
  const secret=document.getElementById('adminSecret')?.value||'';if(!secret){cloudMessage='Hãy nhập mã kích hoạt Admin.';R();return;}
  adminBusy=true;R();try{await adminApi('bootstrap',{secret});adminVerified=true;cloudMessage='✅ Đã cấp quyền Admin cho tài khoản đang đăng nhập.';adminBusy=false;await adminRefresh();}catch(e){cloudMessage='❌ '+String(e.message||e);adminBusy=false;R();}
}

async function loadRemoteContent(appId){
  if(!supabaseClient)return;
  try{
    const {data,error}=await supabaseClient.from('app_content_items').select('content_type,content_id,title,payload,is_published').eq('app_id',appId).eq('is_published',true).limit(500);
    if(error)throw error;
    if(appId==='tin_hoc_rpg'){
      remoteContentLoaded=!!(data||[]).length;
      remoteAnnouncements=(data||[]).filter(x=>x.content_type==='announcement'||x.content_type==='page');
      for(const x of data||[]){
        const p=x.payload||{};
        if(x.content_type==='lesson'){
          const key=x.content_id;const level=Number(p.level);
          if(p.__disabled){for(const group of L)group[2]=group[2].split(', ').filter(t=>t!==key).join(', ');delete TOPIC_DETAIL[key];delete TOPIC_MORE[key];continue;}
          if(!Object.prototype.hasOwnProperty.call(TOPIC_DETAIL,key)&&Number.isInteger(level)&&L[level]&&!L[level][2].split(', ').includes(key))L[level][2]=L[level][2]+', '+key;
          TOPIC_DETAIL[key]={title:x.title,explain:String(p.explain||p.body||''),example:String(p.example||''),code:String(p.code||''),complexity:String(p.complexity||''),pitfalls:String(p.pitfalls||''),check:String(p.check||'')};
        }else if(x.content_type==='problem'){
          const id=Number(x.content_id);if(!Number.isInteger(id)||id<0||id>P.length)continue;
          const row=[p.__disabled?-100:(Number(p.level)||0),String(p.difficulty||'e'),x.title,String(p.statement||''),String(p.input||''),String(p.output||''),p.url||null];
          if(id===P.length)P.push(row);else P[id]=row;P[id].id=id;
        }
      }
    }
  }catch(e){console.debug('Remote content not loaded yet',e);}
}

const V={
tree(){const c=lvl(S.x)[0];return L.map((v,i)=>{const ps=P.filter(p=>p[0]==i),n=ps.filter(p=>S.done[p.id]).length;return`<div class="nd${i==c?' cur':''}" style="--k:${col(i)}${i>c?';opacity:.55':''}"><span>${v[1]}</span><div class="g1"><b>LV${i} ${v[0]}</b><br><small>${ps.length?n+'/'+ps.length+' bài':'Chưa có bài'}, cần ${need(i)} EXP để lên cấp</small></div><b>${i<c?'✔':i==c?'✨':'🔒'}</b></div>`}).join('')},
learn(){return renderKnowledge()},  prac(){
    const c=lvl(S.x)[0];
    if(cur!=null)return pv(P[cur]);
    const q=reqFor(c),ready=reqReady(c);
    return `<div class="note">⚔️ <b>Luyện tập LV${c}</b>: chỉ bài đúng của level hiện tại mới được tính EXP. Để lên LV${c+1} cần đủ <b>5 Easy + 2 Medium + 1 Hard</b>; bài sai không cộng EXP.</div>`+
      `<div class="reqBox"><b>Tiến độ yêu cầu</b><div class="reqGrid"><span>🟢 Easy <b>${Math.min(q.e,5)}/5</b></span><span>🟡 Medium <b>${Math.min(q.m,2)}/2</b></span><span>🔴 Hard <b>${Math.min(q.h,1)}/1</b></span></div>${ready?`<div class="okReq">✅ Đủ bộ bài để lên level sau.</div>`:`<small>Cần hoàn thành đủ cả 3 loại độ khó; EXP sẽ bị giới hạn đúng ngưỡng của level.</small>`}</div>`+
      LG()+
      L.map((v,i)=>{
        const ps=P.filter(p=>p[0]===i);
        if(!ps.length)return '';
        const locked=i>c;
        const doneCount=ps.filter(p=>S.done[p.id]).length;
        return `<details class="practiceLevel" ${i===c?'open':''}><summary>${v[1]} <b>LV${i} ${v[0]}</b> <small>${doneCount}/${ps.length} bài${locked?' · 🔒':''}</small></summary>`+
          ps.map(p=>{
            const dn=S.done[p.id];
            const tooLow=p[0]<c;
            const inaccessible=locked;
            const cls=inaccessible?'lk':(tooLow?'old':'pr');
            const badge=dn?`✔ +${dn} EXP`:inaccessible?`🔒 LV${p[0]}`:tooLow?'✓ Đã qua':'▶';
            return `<div class="nd ${cls}${!inaccessible?' problemCard':''}" style="--k:${col(p[0])}" ${!inaccessible?`data-problem-id="${p.id}" role="button" tabindex="0" aria-label="Mở bài ${esc(p[2])}"`:''}><div class="g1"><b>${esc(p[2])}</b><br><small>LV${p[0]} · ${D[p[1]][0]} · +${xp(p)} EXP${tooLow?' · 0 EXP hiện tại':''}</small></div><b>${badge}</b></div>`;
          }).join('')+`</details>`;
      }).join('');
  },

function p7ImportFile(file){
  if(!file)return;const reader=new FileReader();reader.onload=()=>{try{
    const data=JSON.parse(reader.result);const incoming=data?.state||data;if(!incoming||typeof incoming!=='object'||(!('x' in incoming)&&!('rpg' in incoming)))throw new Error('File backup không hợp lệ.');
    const keep={x:S.x,done:S.done,req:S.req};
    Object.assign(S,incoming);S.ver=7;ensureIdeState();S.rpg=normalizeRpg(S.rpg);S.x=Number(S.x)||0;S.done=S.done||{};S.req=S.req||{};
    /* A backup should restore app state, but never manufacture a server session. */
    S.ui=S.ui||{};S.ui.lastBackup=new Date().toISOString();sv();applyPhase7UI();p7Toast('✅ Đã nhập backup.');R();
  }catch(e){p7Toast('❌ Backup không hợp lệ: '+String(e.message||e));}};reader.onerror=()=>p7Toast('❌ Không đọc được file backup.');reader.readAsText(file);
}

function p7NetworkUpdate(){applyPhase7UI();if(!navigator.onLine){p7Announce('Bạn đang offline. Các dữ liệu cục bộ và workspace vẫn dùng được; judge, contest server và đồng bộ cloud cần Internet.');}}

function head(){const x=lvl(S.x),l=x[0],r=x[1],n=x[2],m=l>=L.length-1,q=reqFor(l),ready=reqReady(l);const prog=m?'MAX':r+'/'+n+' để lên LV'+(l+1);const reqtxt=' · '+q.e+'/5E '+q.m+'/2M '+q.h+'/1H'+(ready&&!m?' · ✅ đủ điều kiện':'');const accountMini=cloudUser?`<span class="rankBadge">🏆 #${cloudRank||'—'}</span> <span class="rankBadge">🏅 ${Number(S.rating||1000)}</span> <span class="rankBadge">💰 ${Number(S.rpg?.gold||0)}</span> <span class="rankBadge">🔥 ${Number(S.rpg?.streak||0)}</span>`:`<span class="rankBadge">👤 Guest</span> <span class="rankBadge">💰 ${Number(S.rpg?.gold||0)}</span> <span class="rankBadge">🔥 ${Number(S.rpg?.streak||0)}</span>`;return (remoteAnnouncements.length?remoteAnnouncements.map(a=>'<div class="note"><b>📢 '+esc(a.title)+'</b><br>'+esc(a.payload?.body||a.payload?.text||'')+'</div>').join(''):'')+'<div class="hd"><div class="bdg">'+L[l][1]+'</div><div class="g1"><b>LV'+l+' '+L[l][0]+'</b><div class="bar"><i style="width:'+(m?100:Math.min(100,r/n*100))+'%"></i></div><small>'+S.x+' EXP'+(m?', MAX':', '+prog)+reqtxt+'</small></div>'+accountMini+'<button onclick="resetRPG()" title="Reset RPG">♻️</button></div>'+(ms?'<div class="note ok">'+esc(ms)+'</div>':'');}

/* ===== FINAL VISUAL ENGINE: VOID FIELD / HOLOGRAPHIC HUD ===== */
let voidCanvas=null,voidCtx=null,voidParticles=[],voidRaf=0,voidLast=0;
function initVoidField(){
  if(document.getElementById('voidField')) return;
  voidCanvas=document.createElement('canvas');voidCanvas.id='voidField';voidCanvas.setAttribute('aria-hidden','true');
  Object.assign(voidCanvas.style,{position:'fixed',inset:'0',width:'100%',height:'100%',zIndex:'0',pointerEvents:'none',opacity:'.72'});
  document.body.appendChild(voidCanvas);voidCtx=voidCanvas.getContext('2d',{alpha:true});
  const resize=()=>{const d=Math.min(devicePixelRatio||1,1.75);voidCanvas.width=Math.floor(innerWidth*d);voidCanvas.height=Math.floor(innerHeight*d);voidCtx.setTransform(d,0,0,d,0,0);voidParticles=[];const n=Math.min(90,Math.max(34,Math.floor(innerWidth*innerHeight/16000)));for(let i=0;i<n;i++)voidParticles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.12,r:.4+Math.random()*1.5,a:.08+Math.random()*.38,p:Math.random()*Math.PI*2});};
  resize();addEventListener('resize',resize,{passive:true});
  const draw=(t)=>{voidRaf=requestAnimationFrame(draw);if(t-voidLast<28)return;voidLast=t;if(!voidCtx)return;const w=innerWidth,h=innerHeight;voidCtx.clearRect(0,0,w,h);for(const p of voidParticles){p.x+=p.vx;p.y+=p.vy;p.p+=.01;if(p.x<-5)p.x=w+5;if(p.x>w+5)p.x=-5;if(p.y<-5)p.y=h+5;if(p.y>h+5)p.y=-5;const g=voidCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*8);g.addColorStop(0,`rgba(155,108,255,${p.a})`);g.addColorStop(1,'rgba(155,108,255,0)');voidCtx.fillStyle=g;voidCtx.beginPath();voidCtx.arc(p.x,p.y,p.r*8,0,Math.PI*2);voidCtx.fill();voidCtx.fillStyle=`rgba(230,235,255,${Math.max(.05,p.a+.12*Math.sin(p.p))})`;voidCtx.beginPath();voidCtx.arc(p.x,p.y,p.r,0,Math.PI*2);voidCtx.fill();}
  };
  cancelAnimationFrame(voidRaf);voidRaf=requestAnimationFrame(draw);
}
function stopVoidField(){cancelAnimationFrame(voidRaf);voidRaf=0;if(voidCanvas)voidCanvas.style.display='none';}
function finalVisualBoot(){
  initVoidField();
  document.body.classList.add('voidRpg');
  const root=document.documentElement;
  addEventListener('pointermove',e=>{root.style.setProperty('--mx',`${e.clientX}px`);root.style.setProperty('--my',`${e.clientY}px`);},{passive:true});
  addEventListener('pointerdown',e=>{const b=e.target?.closest?.('button,.btn,a');if(!b)return;const r=b.getBoundingClientRect();const d=document.createElement('span');d.className='voidRipple';d.style.left=`${e.clientX}px`;d.style.top=`${e.clientY}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),650);},{passive:true});
  if(!root.getAttribute('data-theme') && S?.ui?.theme==='system') root.setAttribute('data-theme','dark');
  const live=document.getElementById('p7Live');
  const observer=new MutationObserver(muts=>{for(const m of muts){for(const n of m.addedNodes){if(n.nodeType===1 && (n.classList?.contains('note')||n.classList?.contains('panel')||n.classList?.contains('contestCard')||n.classList?.contains('rpgCard')))n.style.animation='rise .26s ease both';}}});
  observer.observe(document.getElementById('v')||document.body,{childList:true,subtree:true});
  addEventListener('visibilitychange',()=>{if(document.hidden){return;}if(voidCanvas?.style.display==='none')voidCanvas.style.display='block';voidLast=0;});
}
finalVisualBoot();
